# Topics the AHDT service consumes. Dapr posts each CloudEvent to the route; the service puts
# the data on its in-process bus (`ahdt/services/dapr.py`).
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: ahdt-observations
spec:
  pubsubname: atra-pubsub
  topic: observation.ingested
  routes:
    default: /dapr/events/observation.ingested
  deadLetterTopic: dlq.ahdt
scopes:
  - ahdt
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: ahdt-notifications
spec:
  pubsubname: atra-pubsub
  topic: notification.requested
  routes:
    default: /dapr/events/notification.requested
  deadLetterTopic: dlq.ahdt
scopes:
  - ahdt
