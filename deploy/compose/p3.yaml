# Profile p3: operations (design 02, 2.2 and design 07, 7.6). Uses the p1 Postgres.
name: atra-p3

services:
  mlflow:
    build: ../images/mlflow
    ports: ["5000:5000"]
    volumes: ["mlflow:/mlflow"]
    mem_limit: 384m

  temporal:
    image: temporalio/auto-setup:1.28
    ports: ["7233:7233"]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: atra
      POSTGRES_PWD: ${ATRA_POSTGRES_PASSWORD:-atra}
      POSTGRES_SEEDS: host.docker.internal
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 512m

  temporal-ui:
    image: temporalio/ui:2.40.1
    ports: ["8233:8080"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v3.6.0
    ports: ["9090:9090"]
    volumes: ["../prometheus:/etc/prometheus:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 256m

  grafana:
    image: grafana/grafana:latest
    ports: ["3200:3000"]
    volumes: ["../grafana:/etc/grafana/provisioning:ro"]
    mem_limit: 256m

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports: ["16686:16686", "4317:4317", "4318:4318"]
    mem_limit: 256m

volumes:
  mlflow: {}
