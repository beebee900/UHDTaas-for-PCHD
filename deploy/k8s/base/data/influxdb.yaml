apiVersion: v1
kind: Service
metadata:
  name: influxdb
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: influxdb
  ports:
    - {name: http, port: 8086}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb
  labels:
    app.kubernetes.io/name: influxdb
    atra.health/tier: data
spec:
  serviceName: influxdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: influxdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: influxdb
        atra.health/tier: data
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: influxdb
          image: influxdb:2.7
          env:
            - {name: DOCKER_INFLUXDB_INIT_MODE, value: setup}
            - {name: DOCKER_INFLUXDB_INIT_USERNAME, value: atra}
            - {name: DOCKER_INFLUXDB_INIT_ORG, value: atra}
            - {name: DOCKER_INFLUXDB_INIT_BUCKET, value: ahdt}
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              valueFrom:
                secretKeyRef: {name: atra-secrets, key: influx-password}
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: atra-secrets, key: influx-token}
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb2
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
