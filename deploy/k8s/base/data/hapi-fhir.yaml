apiVersion: v1
kind: Service
metadata:
  name: hapi-fhir
spec:
  selector:
    app.kubernetes.io/name: hapi-fhir
  ports:
    - {name: http, port: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hapi-fhir
  labels:
    app.kubernetes.io/name: hapi-fhir
    atra.health/tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hapi-fhir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hapi-fhir
        atra.health/tier: data
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: hapi-fhir
          image: hapiproject/hapi:v8.4.0-1
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: spring.datasource.url, value: "jdbc:postgresql://postgres:5432/atra"}
            - {name: spring.datasource.username, value: atra}
            - name: spring.datasource.password
              valueFrom:
                secretKeyRef: {name: atra-secrets, key: postgres-password}
            - {name: spring.datasource.driverClassName, value: org.postgresql.Driver}
            - name: spring.jpa.properties.hibernate.dialect
              value: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
            - {name: hapi.fhir.fhir_version, value: R4}
            - {name: hapi.fhir.partitioning.allow_references_across_partitions, value: "false"}
            - {name: hapi.fhir.partitioning.partitioning_include_in_search_hashes,
               value: "false"}
            - {name: JAVA_TOOL_OPTIONS, value: "-Xmx640m"}
          resources:
            requests: {cpu: 200m, memory: 1Gi}
            limits: {memory: 1Gi}
