apiVersion: v1
kind: Service
metadata:
  name: opa
spec:
  selector:
    app.kubernetes.io/name: opa
  ports:
    - {name: http, port: 8181}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  labels:
    app.kubernetes.io/name: opa
    atra.health/tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opa
        atra.health/tier: data
      annotations:
        linkerd.io/inject: enabled
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      # The policy tree keeps its directories (they name the data documents), so it is
      # copied from the application image instead of a flat ConfigMap.
      initContainers:
        - name: policies
          image: atra-health
          command: [cp, -r, /app/policies/opa/., /policies/]
          volumeMounts:
            - {name: policies, mountPath: /policies}
      containers:
        - name: opa
          image: openpolicyagent/opa:1.21.1
          args: [run, --server, --addr, ":8181", /policies]
          ports:
            - {name: http, containerPort: 8181}
          readinessProbe:
            httpGet: {path: /health, port: http}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: policies, mountPath: /policies, readOnly: true}
      volumes:
        - name: policies
          emptyDir: {}
