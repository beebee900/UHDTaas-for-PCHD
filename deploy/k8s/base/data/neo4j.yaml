apiVersion: v1
kind: Service
metadata:
  name: neo4j
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - {name: http, port: 7474}
    - {name: bolt, port: 7687}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  labels:
    app.kubernetes.io/name: neo4j
    atra.health/tier: data
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
        atra.health/tier: data
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: neo4j
          image: neo4j:5
          env:
            - {name: NEO4J_server_memory_heap_max__size, value: 512m}
            - {name: NEO4J_server_memory_pagecache_size, value: 256m}
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef: {name: atra-secrets, key: neo4j-auth}
          resources:
            requests: {cpu: 50m, memory: 1Gi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
