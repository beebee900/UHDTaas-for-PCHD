apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - {name: http, port: 6333}
    - {name: grpc, port: 6334}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: qdrant
    atra.health/tier: data
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        atra.health/tier: data
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.15.5
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
