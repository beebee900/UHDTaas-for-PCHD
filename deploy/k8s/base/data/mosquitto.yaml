apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto
data:
  mosquitto.conf: |
    # Device traffic uses TLS with device certificates; 1883 serves in-cluster clients only.
    persistence true
    persistence_location /mosquitto/data/
    listener 1883 0.0.0.0
    allow_anonymous true
    listener 8883 0.0.0.0
    cafile /mosquitto/certs/ca.crt
    certfile /mosquitto/certs/mosquitto.crt
    keyfile /mosquitto/certs/mosquitto.key
    require_certificate true
    use_identity_as_username true
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - {name: mqtt, port: 1883}
    - {name: mqtts, port: 8883}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mosquitto
  labels:
    app.kubernetes.io/name: mosquitto
    atra.health/tier: data
spec:
  serviceName: mosquitto
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
        atra.health/tier: data
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 32Mi}
          volumeMounts:
            - name: data
              mountPath: /mosquitto/data
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: certs
              mountPath: /mosquitto/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mosquitto
        # ca.crt, mosquitto.crt and mosquitto.key from the local CA (make pki).
        - name: certs
          secret:
            secretName: mosquitto-tls
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
