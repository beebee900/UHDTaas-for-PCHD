apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edge-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: edge
spec:
  selector:
    app.kubernetes.io/name: edge
  ports:
    - name: http
      port: 8095
      targetPort: http
    - name: coap
      port: 5683
      targetPort: coap
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: edge
    atra.health/tier: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge
        atra.health/tier: app
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/proxy-memory-limit: 64Mi
        dapr.io/enabled: "true"
        dapr.io/app-id: edge
        dapr.io/app-port: "8095"
        dapr.io/config: atra
        dapr.io/sidecar-memory-limit: 128Mi
    spec:
      serviceAccountName: edge
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge
          image: atra-health
          command: [python, -m, uvicorn, "edge.app:build_app", --factory, --host, 0.0.0.0,
                    --port, "8095"]
          ports:
            - name: http
              containerPort: 8095
            - name: coap
              containerPort: 5683
              protocol: UDP
          envFrom:
            - configMapRef:
                name: atra-config
            - secretRef:
                name: atra-secrets
                optional: true
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: var
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: var
          persistentVolumeClaim:
            claimName: edge-data
        - name: tmp
          emptyDir: {}
