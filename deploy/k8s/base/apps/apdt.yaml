apiVersion: v1
kind: ServiceAccount
metadata:
  name: apdt
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: apdt
  labels:
    app.kubernetes.io/name: apdt
spec:
  selector:
    app.kubernetes.io/name: apdt
  ports:
    - name: http
      port: 8200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apdt
  labels:
    app.kubernetes.io/name: apdt
    atra.health/tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apdt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apdt
        atra.health/tier: app
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/proxy-memory-limit: 64Mi
        dapr.io/enabled: "true"
        dapr.io/app-id: apdt
        dapr.io/app-port: "8200"
        dapr.io/config: atra
        dapr.io/sidecar-memory-limit: 128Mi
    spec:
      serviceAccountName: apdt
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apdt
          image: atra-health
          command: [python, -m, uvicorn, "apdt.app:build_app", --factory, --host, 0.0.0.0,
                    --port, "8200"]
          ports:
            - name: http
              containerPort: 8200
          envFrom:
            - configMapRef:
                name: atra-config
            - secretRef:
                name: atra-secrets
                optional: true
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 600Mi}
            limits: {memory: 600Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: var
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: var
          emptyDir: {}
        - name: tmp
          emptyDir: {}
