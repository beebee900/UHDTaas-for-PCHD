apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ahdt-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ahdt
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: ahdt
  labels:
    app.kubernetes.io/name: ahdt
spec:
  selector:
    app.kubernetes.io/name: ahdt
  ports:
    - name: http
      port: 8100
      targetPort: http
    - name: grpc
      port: 50051
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ahdt
  labels:
    app.kubernetes.io/name: ahdt
    atra.health/tier: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ahdt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ahdt
        atra.health/tier: app
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/proxy-memory-limit: 64Mi
        dapr.io/enabled: "true"
        dapr.io/app-id: ahdt
        dapr.io/app-port: "8100"
        dapr.io/config: atra
        dapr.io/sidecar-memory-limit: 128Mi
    spec:
      serviceAccountName: ahdt
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ahdt
          image: atra-health
          command: [python, -m, uvicorn, "ahdt.app:build_app", --factory, --host, 0.0.0.0,
                    --port, "8100"]
          ports:
            - name: http
              containerPort: 8100
            - name: grpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: atra-config
            - secretRef:
                name: atra-secrets
                optional: true
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 1200Mi}
            limits: {memory: 1200Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: var
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: var
          persistentVolumeClaim:
            claimName: ahdt-data
        - name: tmp
          emptyDir: {}
