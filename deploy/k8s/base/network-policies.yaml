# Ingress is denied unless a policy below allows it. Services talk to each other inside the
# namespace; the data tier takes traffic only from the services; devices reach the MQTT
# TLS listener and the edge CoAP port; the K3s ingress controller reaches the public APIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-from-app
spec:
  podSelector:
    matchLabels:
      atra.health/tier: app
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              atra.health/tier: app
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-from-app
spec:
  podSelector:
    matchLabels:
      atra.health/tier: data
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              atra.health/tier: app
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-hapi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hapi-fhir
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devices-to-mqtt-and-coap
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [mosquitto, edge]}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8883}
        - {protocol: UDP, port: 5683}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-controller-to-apis
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [apdt, channels, edge]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: TCP, port: 8200}
        - {protocol: TCP, port: 8300}
        - {protocol: TCP, port: 8095}
---
# The data tier connects only inside the namespace, to DNS and to the Linkerd control plane.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-egress-in-cluster
spec:
  podSelector:
    matchLabels:
      atra.health/tier: data
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
