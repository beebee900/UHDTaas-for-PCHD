components:
  schemas:
    AHDTExplanation:
      additionalProperties: false
      properties:
        artefacts:
          anyOf:
          - items:
              $ref: '#/components/schemas/Artefact'
            type: array
          - type: 'null'
          default: null
          title: Artefacts
        causal_graph_ref:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Causal Graph Ref
        counterfactuals:
          anyOf:
          - items:
              $ref: '#/components/schemas/Counterfactual'
            type: array
          - type: 'null'
          default: null
          title: Counterfactuals
        drivers:
          items:
            $ref: '#/components/schemas/Driver'
          title: Drivers
          type: array
        explainer:
          title: Explainer
          type: string
        explanation_id:
          title: Explanation Id
          type: string
        method_family:
          enum:
          - attribution
          - saliency
          - counterfactual
          - sensitivity
          - rule_trace
          - ontology_justification
          - citation
          - temporal_attribution
          - graph
          title: Method Family
          type: string
        model_id:
          title: Model Id
          type: string
        output_id:
          title: Output Id
          type: string
        quality:
          anyOf:
          - $ref: '#/components/schemas/ExplanationQuality'
          - type: 'null'
          default: null
        text:
          title: Text
          type: string
        uncertainty:
          additionalProperties: true
          title: Uncertainty
          type: object
        version:
          title: Version
          type: string
      required:
      - explanation_id
      - output_id
      - model_id
      - version
      - explainer
      - method_family
      - text
      title: AHDTExplanation
      type: object
    AgentRunRequest:
      description: Name a `twin` to run its orchestrator, or a `person_goal` to run the conductor.
      properties:
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
        now:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Now
        person_goal:
          anyOf:
          - type: string
          - type: 'null'
          title: Person Goal
        plans:
          items:
            $ref: '#/components/schemas/PlanIn'
          title: Plans
          type: array
        probes:
          description: Action classes to attempt, to show the guard's answer
          items:
            type: string
          title: Probes
          type: array
        triggers:
          items:
            type: string
          title: Triggers
          type: array
        twin:
          anyOf:
          - $ref: '#/components/schemas/DTKind'
          - type: 'null'
      required:
      - hdt_id
      title: AgentRunRequest
      type: object
    Artefact:
      additionalProperties: false
      properties:
        kind:
          enum:
          - heatmap
          - plot
          - subgraph
          title: Kind
          type: string
        ref:
          title: Ref
          type: string
      required:
      - kind
      - ref
      title: Artefact
      type: object
    CalibrateArgs:
      additionalProperties: false
      properties:
        dt:
          $ref: '#/components/schemas/DTKind'
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
        model_id:
          title: Model Id
          type: string
      required:
      - hdt_id
      - dt
      - model_id
      title: CalibrateArgs
      type: object
    CalibrateData:
      additionalProperties: false
      properties:
        fit_after:
          title: Fit After
          type: number
        fit_before:
          title: Fit Before
          type: number
        instance_id:
          title: Instance Id
          type: string
        revision:
          minimum: 0
          title: Revision
          type: integer
      required:
      - instance_id
      - revision
      - fit_before
      - fit_after
      title: CalibrateData
      type: object
    CausalGraphArgs:
      additionalProperties: false
      properties:
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
        output_id:
          title: Output Id
          type: string
      required:
      - hdt_id
      - output_id
      title: CausalGraphArgs
      type: object
    CausalGraphData:
      additionalProperties: false
      properties:
        edges:
          items:
            $ref: '#/components/schemas/GraphEdge'
          title: Edges
          type: array
        nodes:
          items:
            $ref: '#/components/schemas/GraphNode'
          title: Nodes
          type: array
      required:
      - nodes
      - edges
      title: CausalGraphData
      type: object
    CohortExtractArgs:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: As Of
        cohort_def:
          additionalProperties: true
          title: Cohort Def
          type: object
        fields:
          items:
            type: string
          minItems: 1
          title: Fields
          type: array
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
        privacy:
          anyOf:
          - $ref: '#/components/schemas/KAnonymity'
          - $ref: '#/components/schemas/DifferentialPrivacy'
          title: Privacy
      required:
      - hdt_id
      - cohort_def
      - fields
      - privacy
      title: CohortExtractArgs
      type: object
    CohortExtractData:
      additionalProperties: false
      properties:
        aggregates:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Aggregates
        privacy_report:
          additionalProperties: true
          title: Privacy Report
          type: object
        rows:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          default: null
          title: Rows
      required:
      - privacy_report
      title: CohortExtractData
      type: object
    ConnectorRow:
      properties:
        buffered:
          title: Buffered
          type: integer
        connector:
          description: Connector name in design 03, 3.16
          title: Connector
          type: string
        direction:
          title: Direction
          type: string
        in:
          anyOf:
          - $ref: '#/components/schemas/ContractRef'
          - type: 'null'
        metrics:
          additionalProperties:
            type: integer
          title: Metrics
          type: object
        mode:
          title: Mode
          type: string
        name:
          description: <connector>:<source>-><target>
          title: Name
          type: string
        out:
          $ref: '#/components/schemas/ContractRef'
        purpose:
          title: Purpose
          type: string
        purposes:
          items:
            type: string
          title: Purposes
          type: array
        source:
          title: Source
          type: string
        state:
          title: State
          type: string
        target:
          title: Target
          type: string
        topics:
          $ref: '#/components/schemas/ConnectorTopics'
      required:
      - name
      - connector
      - source
      - target
      - mode
      - direction
      - out
      - purpose
      - purposes
      - topics
      - state
      - buffered
      - metrics
      title: ConnectorRow
      type: object
    ConnectorTopics:
      properties:
        dlq:
          title: Dlq
          type: string
        in:
          anyOf:
          - type: string
          - type: 'null'
          title: In
        out:
          title: Out
          type: string
      required:
      - out
      - dlq
      title: ConnectorTopics
      type: object
    ContractRef:
      properties:
        contract:
          description: <name>/v<version>
          title: Contract
          type: string
        fields:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          description: Field name to UCUM unit
          title: Fields
          type: object
      required:
      - contract
      - fields
      title: ContractRef
      type: object
    ConverseArgs:
      additionalProperties: false
      properties:
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
        language:
          enum:
          - en
          - yo
          - ha
          - ig
          - pcm
          title: Language
          type: string
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Session Id
        utterance:
          minLength: 1
          title: Utterance
          type: string
      required:
      - hdt_id
      - utterance
      - language
      title: ConverseArgs
      type: object
    ConverseData:
      additionalProperties: false
      properties:
        grounded_on:
          items:
            $ref: '#/components/schemas/GraphCitation'
          title: Grounded On
          type: array
        language:
          enum:
          - en
          - yo
          - ha
          - ig
          - pcm
          title: Language
          type: string
        reply:
          title: Reply
          type: string
        session_id:
          title: Session Id
          type: string
      required:
      - reply
      - language
      - session_id
      - grounded_on
      title: ConverseData
      type: object
    CosimulateArgs:
      additionalProperties: false
      properties:
        dts:
          items:
            $ref: '#/components/schemas/DTKind'
          minItems: 2
          title: Dts
          type: array
        fork:
          const: true
          default: true
          title: Fork
          type: boolean
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
        horizon_h:
          exclusiveMinimum: 0
          maximum: 720
          title: Horizon H
          type: number
        scenario:
          $ref: '#/components/schemas/Scenario'
        step_s:
          exclusiveMinimum: 0
          title: Step S
          type: number
      required:
      - hdt_id
      - scenario
      - dts
      - horizon_h
      - step_s
      title: CosimulateArgs
      type: object
    Counterfactual:
      additionalProperties: false
      properties:
        changes:
          additionalProperties: true
          title: Changes
          type: object
        outcome:
          title: Outcome
      required:
      - changes
      - outcome
      title: Counterfactual
      type: object
    CouplingMatrix:
      properties:
        connectors:
          items:
            $ref: '#/components/schemas/ConnectorRow'
          title: Connectors
          type: array
        count:
          title: Count
          type: integer
        hdt_id:
          title: Hdt Id
          type: string
        matrix:
          additionalProperties:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
          description: source twin -> target twin -> contract names, reverse paths included
          title: Matrix
          type: object
        running:
          title: Running
          type: boolean
      required:
      - hdt_id
      - running
      - count
      - connectors
      - matrix
      title: CouplingMatrix
      type: object
    DTKind:
      description: The 17 peer DTs of the federated Human Digital Twin, plus the Patient DT (APDT).
      enum:
      - cardiovascular
      - respiratory
      - nervous
      - sensory
      - digestive
      - hepatobiliary
      - renal_urinary
      - endocrine
      - immune_lymphatic
      - haematological
      - musculoskeletal
      - integumentary
      - reproductive
      - whole_body
      - behavioural_cognitive
      - social
      - population
      - patient
      title: DTKind
      type: string
    DifferentialPrivacy:
      additionalProperties: false
      properties:
        epsilon:
          exclusiveMinimum: 0
          title: Epsilon
          type: number
      required:
      - epsilon
      title: DifferentialPrivacy
      type: object
    DocumentHit:
      additionalProperties: false
      properties:
        doc_id:
          title: Doc Id
          type: string
        score:
          title: Score
          type: number
        section_path:
          items:
            type: string
          title: Section Path
          type: array
        snippet:
          title: Snippet
          type: string
      required:
      - doc_id
      - section_path
      - snippet
      - score
      title: DocumentHit
      type: object
    DocumentsArgs:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: As Of
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
        query:
          minLength: 1
          title: Query
          type: string
        top_k:
          default: 5
          maximum: 50
          minimum: 1
          title: Top K
          type: integer
        types:
          anyOf:
          - items:
              enum:
              - discharge_summary
              - note
              - report
              type: string
            type: array
          - type: 'null'
          default: null
          title: Types
      required:
      - hdt_id
      - query
      title: DocumentsArgs
      type: object
    DocumentsData:
      additionalProperties: false
      properties:
        hits:
          items:
            $ref: '#/components/schemas/DocumentHit'
          title: Hits
          type: array
      required:
      - hits
      title: DocumentsData
      type: object
    Driver:
      additionalProperties: false
      properties:
        contribution:
          title: Contribution
          type: number
        direction:
          enum:
          - up
          - down
          title: Direction
          type: string
        feature:
          title: Feature
          type: string
        value:
          default: null
          title: Value
      required:
      - feature
      - contribution
      - direction
      title: Driver
      type: object
    ExplainArgs:
      additionalProperties: false
      properties:
        audience:
          default: clinician
          enum:
          - clinician
          - patient
          - pharmacist
          - nurse
          - radiologist
          title: Audience
          type: string
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
        output_id:
          title: Output Id
          type: string
      required:
      - hdt_id
      - output_id
      title: ExplainArgs
      type: object
    ExplanationQuality:
      additionalProperties: false
      properties:
        complexity:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Complexity
        faithfulness:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Faithfulness
        robustness:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Robustness
      title: ExplanationQuality
      type: object
    FacetArgs:
      additionalProperties: false
      properties:
        anatomy:
          title: Anatomy
          type: string
        facet:
          title: Facet
          type: string
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
      required:
      - hdt_id
      - anatomy
      - facet
      title: FacetArgs
      type: object
    FacetView:
      additionalProperties: false
      properties:
        anatomy:
          title: Anatomy
          type: string
        facet:
          title: Facet
          type: string
        fields:
          additionalProperties: true
          title: Fields
          type: object
        fork_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Fork Id
        instance_id:
          title: Instance Id
          type: string
        revision:
          title: Revision
          type: integer
        uncertainty:
          additionalProperties: true
          title: Uncertainty
          type: object
      required:
      - instance_id
      - anatomy
      - facet
      - fields
      - revision
      title: FacetView
      type: object
    Finding:
      additionalProperties: false
      properties:
        code:
          title: Code
          type: string
        confidence:
          maximum: 1
          minimum: 0
          title: Confidence
          type: number
        display:
          title: Display
          type: string
        value:
          default: null
          title: Value
      required:
      - code
      - display
      - confidence
      title: Finding
      type: object
    ForecastArgs:
      additionalProperties: false
      properties:
        dt:
          $ref: '#/components/schemas/DTKind'
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
        horizon_h:
          exclusiveMinimum: 0
          maximum: 720
          title: Horizon H
          type: number
        variable:
          title: Variable
          type: string
      required:
      - hdt_id
      - dt
      - variable
      - horizon_h
      title: ForecastArgs
      type: object
    ForecastData:
      additionalProperties: false
      properties:
        level:
          exclusiveMaximum: 1
          exclusiveMinimum: 0
          title: Level
          type: number
        lower:
          items:
            type: number
          title: Lower
          type: array
        mean:
          items:
            type: number
          title: Mean
          type: array
        output_id:
          title: Output Id
          type: string
        t:
          items:
            type: number
          title: T
          type: array
        upper:
          items:
            type: number
          title: Upper
          type: array
      required:
      - t
      - mean
      - lower
      - upper
      - level
      - output_id
      title: ForecastData
      type: object
    GenomeArgs:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: As Of
        genes:
          items:
            type: string
          minItems: 1
          title: Genes
          type: array
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
      required:
      - hdt_id
      - genes
      title: GenomeArgs
      type: object
    GenomeData:
      additionalProperties: false
      properties:
        variants:
          items:
            $ref: '#/components/schemas/Variant'
          title: Variants
          type: array
      required:
      - variants
      title: GenomeData
      type: object
    GraphCitation:
      additionalProperties: false
      properties:
        doc_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Doc Id
        label:
          title: Label
          type: string
        node_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Node Id
        path:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Path
      required:
      - label
      title: GraphCitation
      type: object
    GraphEdge:
      additionalProperties: false
      properties:
        from:
          title: From
          type: string
        to:
          title: To
          type: string
        weight:
          title: Weight
          type: number
      required:
      - from
      - to
      - weight
      title: GraphEdge
      type: object
    GraphNode:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: string
        kind:
          enum:
          - model
          - message
          - observation
          title: Kind
          type: string
        label:
          title: Label
          type: string
      required:
      - id
      - kind
      - label
      title: GraphNode
      type: object
    GraphQueryArgs:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: As Of
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
        mode:
          default: hybrid
          enum:
          - graphrag
          - vector
          - chunkless
          - hybrid
          title: Mode
          type: string
        question:
          minLength: 1
          title: Question
          type: string
      required:
      - hdt_id
      - question
      title: GraphQueryArgs
      type: object
    GraphQueryData:
      additionalProperties: false
      properties:
        answer:
          title: Answer
          type: string
        citations:
          items:
            $ref: '#/components/schemas/GraphCitation'
          title: Citations
          type: array
        subgraph:
          anyOf:
          - $ref: '#/components/schemas/Subgraph'
          - type: 'null'
          default: null
      required:
      - answer
      - citations
      title: GraphQueryData
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ImagingArgs:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: As Of
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
        modality:
          enum:
          - CR
          - DX
          - CT
          - MR
          - US
          - SM
          title: Modality
          type: string
        period:
          anyOf:
          - $ref: '#/components/schemas/Period'
          - type: 'null'
          default: null
      required:
      - hdt_id
      - modality
      title: ImagingArgs
      type: object
    ImagingData:
      additionalProperties: false
      properties:
        studies:
          items:
            $ref: '#/components/schemas/ImagingStudy'
          title: Studies
          type: array
      required:
      - studies
      title: ImagingData
      type: object
    ImagingStudy:
      additionalProperties: false
      properties:
        description:
          title: Description
          type: string
        dicomweb_url:
          title: Dicomweb Url
          type: string
        modality:
          title: Modality
          type: string
        series_count:
          minimum: 0
          title: Series Count
          type: integer
        started:
          format: date-time
          title: Started
          type: string
        study_uid:
          title: Study Uid
          type: string
      required:
      - study_uid
      - modality
      - started
      - description
      - dicomweb_url
      - series_count
      title: ImagingStudy
      type: object
    KAnonymity:
      additionalProperties: false
      properties:
        k:
          minimum: 2
          title: K
          type: integer
      required:
      - k
      title: KAnonymity
      type: object
    KnowledgeArgs:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: As Of
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
        params:
          additionalProperties: true
          title: Params
          type: object
        query_id:
          title: Query Id
          type: string
      required:
      - hdt_id
      - query_id
      - params
      title: KnowledgeArgs
      type: object
    KnowledgeData:
      additionalProperties: false
      properties:
        rows:
          items:
            additionalProperties: true
            type: object
          title: Rows
          type: array
      required:
      - rows
      title: KnowledgeData
      type: object
    MedicationEntry:
      additionalProperties: false
      properties:
        adherence:
          anyOf:
          - maximum: 1
            minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Adherence
        atc:
          title: Atc
          type: string
        display:
          title: Display
          type: string
        dose:
          title: Dose
          type: string
        end:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: End
        frequency:
          title: Frequency
          type: string
        route:
          title: Route
          type: string
        rxnorm:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Rxnorm
        start:
          format: date-time
          title: Start
          type: string
      required:
      - atc
      - display
      - dose
      - route
      - frequency
      - start
      title: MedicationEntry
      type: object
    MedicationsArgs:
      additionalProperties: false
      properties:
        active_only:
          default: false
          title: Active Only
          type: boolean
        as_of:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: As Of
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
      required:
