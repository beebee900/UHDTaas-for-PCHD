info:
  description: 'Agentic Human Digital Twin: Layer 6 services and Layer 7 agents'
  title: AHDT
  version: 1.0.0
openapi: 3.1.0
paths:
  /.well-known/jwks.json:
    get:
      operationId: jwks__well_known_jwks_json_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Jwks  Well Known Jwks Json Get
                type: object
          description: Successful Response
      summary: Jwks
      tags:
      - operations
  /health:
    get:
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Health Get
                type: object
          description: Successful Response
      summary: Health
      tags:
      - operations
  /v1/agents/run:
    post:
      operationId: run_v1_agents_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Run V1 Agents Run Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Run a twin orchestrator or the conductor and return its report
      tags:
      - agents
  /v1/fhir/{resource_type}:
    get:
      operationId: search_v1_fhir__resource_type__get
      parameters:
      - in: path
        name: resource_type
        required: true
        schema:
          title: Resource Type
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Search V1 Fhir  Resource Type  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Search the FHIR resources of one person
      tags:
      - fhir
  /v1/fhir/{resource_type}/{resource_id}:
    get:
      operationId: read_v1_fhir__resource_type___resource_id__get
      parameters:
      - in: path
        name: resource_type
        required: true
        schema:
          title: Resource Type
          type: string
      - in: path
        name: resource_id
        required: true
        schema:
          title: Resource Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Read V1 Fhir  Resource Type   Resource Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Read one FHIR resource of a person
      tags:
      - fhir
  /v1/identity/reidentify:
    post:
      operationId: reidentify_v1_identity_reidentify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReidentifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Reidentify V1 Identity Reidentify Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Direct identifiers recorded for an hdt_id (audited)
      tags:
      - identity
  /v1/import:
    post:
      operationId: import_batch_v1_import_post
      parameters:
      - in: query
        name: format
        required: true
        schema:
          pattern: ^(fhir|hl7v2|csv|dicom|vcf)$
          title: Format
          type: string
      - in: query
        name: hdt_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Hdt Id
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Import Batch V1 Import Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 'Import a batch: FHIR Bundle, HL7 v2, CSV, DICOM or VCF'
      tags:
      - ingestion
  /v1/language/status:
    get:
      operationId: language_status_v1_language_status_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Language Status V1 Language Status Get
                type: object
          description: Successful Response
      summary: The conversation backends in the order they are tried, with their use
      tags:
      - language
  /v1/models:
    get:
      operationId: models_v1_models_get
      parameters:
      - in: query
        name: twin
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Twin
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                title: Response Models V1 Models Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Registered models with their stage
      tags:
      - lifecycle
  /v1/models/{model_id}/rollback:
    post:
      operationId: rollback_v1_models__model_id__rollback_post
      parameters:
      - in: path
        name: model_id
        required: true
        schema:
          title: Model Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Rollback V1 Models  Model Id  Rollback Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Re-promote the newest archived version
      tags:
      - lifecycle
  /v1/models/{model_id}/versions/{version}/stage:
    post:
      operationId: stage_v1_models__model_id__versions__version__stage_post
      parameters:
      - in: path
        name: model_id
        required: true
        schema:
          title: Model Id
          type: string
      - in: path
        name: version
        required: true
        schema:
          title: Version
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageChange'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Stage V1 Models  Model Id  Versions  Version  Stage Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Move a model version to Staging, Production or Archived
      tags:
      - lifecycle
  /v1/persons/{hdt_id}/coupling:
    get:
      operationId: coupling_v1_persons__hdt_id__coupling_get
      parameters:
      - in: path
        name: hdt_id
        required: true
        schema:
          title: Hdt Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouplingMatrix'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Connectors and coupling matrix of the person's running HDT
      tags:
      - coupling
  /v1/persons/{hdt_id}/findings:
    post:
      operationId: finding_v1_persons__hdt_id__findings_post
      parameters:
      - in: path
        name: hdt_id
        required: true
        schema:
          title: Hdt Id
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Finding V1 Persons  Hdt Id  Findings Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Store a clinician-confirmed finding written back by the APDT
      tags:
      - coupling
  /v1/persons/{hdt_id}/phkg.ttl:
    get:
      operationId: phkg_ttl_v1_persons__hdt_id__phkg_ttl_get
      parameters:
      - in: path
        name: hdt_id
        required: true
        schema:
          title: Hdt Id
          type: string
      responses:
        '200':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: The person's health knowledge graph as FHIR RDF Turtle
      tags:
      - knowledge
  /v1/tools/ahdt.cognitive.converse:
    post:
      operationId: ahdt_cognitive_converse_v1_tools_ahdt_cognitive_converse_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConverseArgs'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConverseData'
          description: Tool result
      summary: Natural-language interaction in the patient's language
      tags:
      - tools
  /v1/tools/ahdt.cognitive.perceive:
    post:
      operationId: ahdt_cognitive_perceive_v1_tools_ahdt_cognitive_perceive_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerceiveArgs'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerceiveData'
          description: Tool result
      summary: Findings from speech, image, signal or text
      tags:
      - tools
  /v1/tools/ahdt.cognitive.reason:
    post:
      operationId: ahdt_cognitive_reason_v1_tools_ahdt_cognitive_reason_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonArgs'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReasonData'
          description: Tool result
      summary: Ontology, causal, probabilistic or temporal reasoning
      tags:
      - tools
  /v1/tools/ahdt.cognitive.request_data:
    post:
      operationId: ahdt_cognitive_request_data_v1_tools_ahdt_cognitive_request_data_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDataArgs'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDataData'
          description: Tool result
      summary: Request for missing data from the person, a device or a clinician
      tags:
      - tools
  /v1/tools/ahdt.data.cohort_extract:
