components:
  schemas:
    AHDTPanel:
      additionalProperties: false
      properties:
        degraded:
          default: false
          title: Degraded
          type: boolean
        forecast:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Forecast
        hdt_id:
          title: Hdt Id
          type: string
        tiles:
          items:
            $ref: '#/components/schemas/TwinTile'
          title: Tiles
          type: array
        vitals:
          additionalProperties:
            $ref: '#/components/schemas/SourcedItem'
          title: Vitals
          type: object
      required:
      - hdt_id
      - tiles
      - vitals
      title: AHDTPanel
      type: object
    Actor:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: string
        role:
          title: Role
          type: string
      required:
      - id
      - role
      title: Actor
      type: object
    AdministrationEntry:
      additionalProperties: false
      description: A medication the nurse gives, or a care activity the nurse carries out.
      properties:
        dose:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Dose
        given_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Given At
        item:
          maxLength: 200
          minLength: 1
          title: Item
          type: string
        kind:
          enum:
          - medication
          - care
          title: Kind
          type: string
        notes:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Notes
        route:
          anyOf:
          - enum:
            - oral
            - intravenous
            - intramuscular
            - subcutaneous
            - topical
            - inhaled
            - rectal
            - other
            type: string
          - type: 'null'
          title: Route
      required:
      - kind
      - item
      title: AdministrationEntry
      type: object
    AlertAck:
      additionalProperties: false
      properties:
        by:
          title: By
          type: string
        observations:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Observations
      required:
      - by
      title: AlertAck
      type: object
    AlertAckResult:
      additionalProperties: false
      properties:
        acknowledged_at:
          format: date-time
          title: Acknowledged At
          type: string
        acknowledged_by:
          title: Acknowledged By
          type: string
        alert_id:
          title: Alert Id
          type: string
      required:
      - alert_id
      - acknowledged_by
      - acknowledged_at
      title: AlertAckResult
      type: object
    Alternative:
      additionalProperties: false
      properties:
        score:
          title: Score
          type: number
        text:
          title: Text
          type: string
        why_lower:
          title: Why Lower
          type: string
      required:
      - text
      - score
      - why_lower
      title: Alternative
      type: object
    AuditRecord:
      additionalProperties: false
      properties:
        action:
          title: Action
          type: string
        actor:
          $ref: '#/components/schemas/Actor'
        agent:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent
        detail_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail Ref
        episode_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Episode Id
        hash:
          title: Hash
          type: string
        hdt_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Hdt Id
        outcome:
          enum:
          - ok
          - denied
          - degraded
          - error
          title: Outcome
          type: string
        prev_hash:
          title: Prev Hash
          type: string
        purpose:
          title: Purpose
          type: string
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        seq:
          minimum: 0.0
          title: Seq
          type: integer
        service:
          title: Service
          type: string
        t:
          format: date-time
          title: T
          type: string
        target:
          title: Target
          type: string
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
        trace_id:
          title: Trace Id
          type: string
      required:
      - seq
      - prev_hash
      - hash
      - t
      - service
      - actor
      - action
      - target
      - purpose
      - outcome
      - trace_id
      title: AuditRecord
      type: object
    AutonomyLevel:
      enum:
      - inform
      - recommend
      - prepare_for_signature
      - act_with_approval
      - act
      - never
      title: AutonomyLevel
      type: string
    BundleCounterfactual:
      additionalProperties: false
      properties:
        change:
          title: Change
          type: string
        delta:
          title: Delta
          type: number
        new_top:
          title: New Top
          type: string
      required:
      - change
      - new_top
      - delta
      title: BundleCounterfactual
      type: object
    BundleRecommendation:
      additionalProperties: false
      properties:
        code:
          anyOf:
          - $ref: '#/components/schemas/Code'
          - type: 'null'
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        conformal_set:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Conformal Set
        interval:
          anyOf:
          - $ref: '#/components/schemas/Interval'
          - type: 'null'
        text:
          title: Text
          type: string
      required:
      - text
      - confidence
      title: BundleRecommendation
      type: object
    CareTeamMember:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: string
        role:
          $ref: '#/components/schemas/Role'
      required:
      - id
      - role
      title: CareTeamMember
      type: object
    Citation:
      additionalProperties: false
      properties:
        kb_entry_id:
          title: Kb Entry Id
          type: string
        section:
          title: Section
          type: string
        source_title:
          title: Source Title
          type: string
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
      required:
      - kb_entry_id
      - source_title
      - section
      title: Citation
      type: object
    ClinicalDecision:
      additionalProperties: false
      properties:
        decided_by:
          $ref: '#/components/schemas/Decider'
        decision:
          enum:
          - accept
          - edit
          - reject
          - sign
          - verify
          - query
          - consent
          - decline
          title: Decision
          type: string
        decision_id:
          title: Decision Id
          type: string
        edited_payload:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Edited Payload
        override_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Override Reason
        recommendation_id:
          title: Recommendation Id
          type: string
        signature:
          title: Signature
          type: string
        signed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Signed At
      required:
      - decision_id
      - recommendation_id
      - decided_by
      - decision
      - signature
      title: ClinicalDecision
      type: object
    ClinicalEntry:
      additionalProperties: false
      description: 'One entry of an episode''s clinical record: a diagnosis, a dispense or care given.

        `resource` is the FHIR resource the entry is stored as.'
      properties:
        details:
          items:
            type: string
          title: Details
          type: array
        entry_id:
          title: Entry Id
          type: string
        kind:
          enum:
          - diagnosis
          - dispense
          - administration
          title: Kind
          type: string
        recorded_at:
          format: date-time
          title: Recorded At
          type: string
        recorded_by:
          $ref: '#/components/schemas/Actor'
        resource:
          additionalProperties: true
          title: Resource
          type: object
        title:
          title: Title
          type: string
      required:
      - entry_id
      - kind
      - title
      - recorded_by
      - recorded_at
      - resource
      title: ClinicalEntry
      type: object
    Code:
      additionalProperties: false
      properties:
        code:
          title: Code
          type: string
        display:
          anyOf:
          - type: string
          - type: 'null'
          title: Display
        system:
          title: System
          type: string
      required:
      - system
      - code
      title: Code
      type: object
    ConsentData:
      additionalProperties: false
      properties:
        consent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Consent Id
        hdt_id:
          title: Hdt Id
          type: string
        purposes:
          items:
            $ref: '#/components/schemas/PurposeOfUse'
          title: Purposes
          type: array
        refused_tools:
          items:
            type: string
          title: Refused Tools
          type: array
      required:
      - hdt_id
      - purposes
      - refused_tools
      title: ConsentData
      type: object
    DTKind:
      description: The 17 peer DTs of the federated Human Digital Twin, plus the Patient DT (APDT).
      enum:
      - cardiovascular
      - respiratory
      - nervous
      - sensory
      - digestive
      - hepatobiliary
      - renal_urinary
      - endocrine
      - immune_lymphatic
      - haematological
      - musculoskeletal
      - integumentary
      - reproductive
      - whole_body
      - behavioural_cognitive
      - social
      - population
      - patient
      title: DTKind
      type: string
    Decider:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: string
        role:
          $ref: '#/components/schemas/Role'
      required:
      - id
      - role
      title: Decider
      type: object
    DiagnosisEntry:
      additionalProperties: false
      description: 'The diagnosis the medical officer makes, in the medical officer''s own words.

        `recommendation_id` names the APDT proposal it was taken from, if any.'
      properties:
        basis:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Basis
        condition:
          maxLength: 200
          minLength: 1
          title: Condition
          type: string
        recommendation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommendation Id
        status:
          default: confirmed
          enum:
          - confirmed
          - provisional
          title: Status
          type: string
      required:
      - condition
      title: DiagnosisEntry
      type: object
    DispenseEntry:
      additionalProperties: false
      description: A medication the pharmacist hands over for the patient.
      properties:
        days_supply:
          anyOf:
          - maximum: 365.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Days Supply
        dose:
          maxLength: 200
          minLength: 1
          title: Dose
          type: string
        medication:
          maxLength: 200
          minLength: 1
          title: Medication
          type: string
        notes:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Notes
        quantity:
          maxLength: 100
          minLength: 1
          title: Quantity
          type: string
      required:
      - medication
      - dose
      - quantity
      title: DispenseEntry
      type: object
    Episode:
      additionalProperties: false
      properties:
        care_team:
          items:
            $ref: '#/components/schemas/CareTeamMember'
          title: Care Team
          type: array
        closed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Closed At
        episode_id:
          title: Episode Id
          type: string
        goal_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Goal Text
        hdt_id:
          title: Hdt Id
          type: string
        opened_at:
          format: date-time
          title: Opened At
          type: string
        reason:
          title: Reason
          type: string
        responsible_clinician:
          title: Responsible Clinician
          type: string
        status:
          enum:
          - open
          - closed
          title: Status
          type: string
        tenant_id:
          title: Tenant Id
          type: string
      required:
      - episode_id
      - tenant_id
      - hdt_id
      - status
      - opened_at
      - reason
      - responsible_clinician
      title: Episode
      type: object
    EpisodeClose:
      additionalProperties: false
      properties:
        discharge_summary_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Discharge Summary Ref
        outcome:
          title: Outcome
          type: string
      required:
      - outcome
      title: EpisodeClose
      type: object
    EpisodeCreate:
      additionalProperties: false
      properties:
        encounter_class:
          default: AMB
          enum:
          - AMB
          - EMER
          - IMP
          - HH
          - VR
          title: Encounter Class
          type: string
        hdt_id:
          pattern: ^hdt-[0-9a-f]{12}$
          title: Hdt Id
          type: string
        reason:
          minLength: 1
          title: Reason
          type: string
        responsible_clinician:
          anyOf:
          - type: string
          - type: 'null'
          title: Responsible Clinician
      required:
      - hdt_id
      - reason
      title: EpisodeCreate
      type: object
    EpisodeListItem:
      additionalProperties: false
      properties:
        episode:
          $ref: '#/components/schemas/Episode'
        patient:
          anyOf:
          - $ref: '#/components/schemas/PatientEntry'
          - type: 'null'
      required:
      - episode
      title: EpisodeListItem
      type: object
    EpisodeView:
      additionalProperties: false
      properties:
        episode:
          $ref: '#/components/schemas/Episode'
        episode_of_care:
          additionalProperties: true
          title: Episode Of Care
          type: object
        resources:
          items:
            additionalProperties: true
            type: object
          title: Resources
          type: array
      required:
      - episode
      - episode_of_care
      title: EpisodeView
      type: object
    EvidenceItem:
      additionalProperties: false
      properties:
        ahdt_explanation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Ahdt Explanation Id
        item:
          title: Item
          type: string
        source:
          enum:
          - apdt
          - ahdt
          title: Source
          type: string
        value:
          title: Value
        weight:
          title: Weight
          type: number
      required:
      - source
      - item
      - weight
      title: EvidenceItem
      type: object
    ExplanationBundle:
      additionalProperties: false
      properties:
        alternatives:
          items:
            $ref: '#/components/schemas/Alternative'
          title: Alternatives
          type: array
        audience_views:
          additionalProperties:
            additionalProperties: true
            type: object
          propertyNames:
            enum:
            - medical_officer
            - pharmacist
            - nurse
            - radiologist
            - patient
          title: Audience Views
          type: object
        bundle_id:
          title: Bundle Id
          type: string
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          title: Citations
          type: array
        counterfactuals:
          items:
            $ref: '#/components/schemas/BundleCounterfactual'
          title: Counterfactuals
          type: array
        created_at:
          format: date-time
          title: Created At
          type: string
        evidence_against:
          items:
            $ref: '#/components/schemas/EvidenceItem'
          title: Evidence Against
          type: array
        evidence_for:
          items:
            $ref: '#/components/schemas/EvidenceItem'
          title: Evidence For
          type: array
        model_versions:
          items:
            $ref: '#/components/schemas/ModelRef'
          title: Model Versions
          type: array
        patient_summary:
          $ref: '#/components/schemas/PatientSummary'
        recommendation:
          $ref: '#/components/schemas/BundleRecommendation'
        recommendation_id:
          title: Recommendation Id
          type: string
        simulation_trace:
          anyOf:
          - $ref: '#/components/schemas/SimulationTrace'
          - type: 'null'
      required:
      - bundle_id
      - recommendation_id
      - recommendation
      - evidence_for
      - evidence_against
      - citations
      - counterfactuals
      - alternatives
      - patient_summary
      - audience_views
      - created_at
      - model_versions
      title: ExplanationBundle
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IntakeCatalogue:
      additionalProperties: false
      description: 'What a clinician can record at intake: findings, tests and measurements from the KB.'
      properties:
        findings:
          items:
            $ref: '#/components/schemas/IntakeFinding'
          title: Findings
          type: array
        measurements:
          items:
            $ref: '#/components/schemas/IntakeMeasurement'
          title: Measurements
          type: array
        tests:
          items:
            $ref: '#/components/schemas/IntakeTest'
          title: Tests
          type: array
      required:
      - findings
      - tests
      - measurements
      title: IntakeCatalogue
      type: object
    IntakeFinding:
      additionalProperties: false
      properties:
        capture:
          enum:
          - question
          - exam
          - lab
          title: Capture
          type: string
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
      required:
      - id
      - name
      - capture
      title: IntakeFinding
      type: object
    IntakeMeasurement:
      additionalProperties: false
      properties:
        field:
          title: Field
          type: string
        unit:
          title: Unit
          type: string
      required:
      - field
      - unit
      title: IntakeMeasurement
      type: object
    IntakeRecord:
      additionalProperties: false
      description: 'Findings (present or absent), test results (positive or negative) and measurements
        of

        one episode, keyed by KB id or field name, with the patient details the reasoner needs.'
      properties:
        avpu:
          default: A
          enum:
          - A
          - V
          - P
          - U
          title: Avpu
          type: string
        findings:
          additionalProperties:
            type: boolean
          title: Findings
          type: object
        measurements:
          additionalProperties:
            type: number
          title: Measurements
          type: object
        pregnancy:
          default: none
          enum:
          - none
          - t1
          - t2
          - t3
          title: Pregnancy
          type: string
        tests:
          additionalProperties:
            type: boolean
          title: Tests
          type: object
        weight_kg:
          anyOf:
          - exclusiveMinimum: 0.0
            maximum: 400.0
            type: number
          - type: 'null'
          title: Weight Kg
      title: IntakeRecord
      type: object
    IntakeTest:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
      required:
      - id
      - name
      title: IntakeTest
      type: object
    Interrupt:
      additionalProperties: false
      properties:
        allowed_decisions:
          items:
            type: string
          title: Allowed Decisions
          type: array
        kind:
          enum:
          - accept_diagnosis
          - verify_prescription
          - sign_prescription
          - approve_care_plan
          - patient_consent_to_treatment
          title: Kind
          type: string
        payload:
          additionalProperties: true
          title: Payload
          type: object
        required_role:
          $ref: '#/components/schemas/Role'
      required:
      - kind
      - payload
      - allowed_decisions
      - required_role
      title: Interrupt
      type: object
    Interval:
      additionalProperties: false
      properties:
        level:
          title: Level
          type: number
        lower:
          title: Lower
          type: number
        upper:
          title: Upper
          type: number
      required:
      - lower
      - upper
      - level
      title: Interval
      type: object
    LoginRequest:
      properties:
        password:
          title: Password
          type: string
        username:
          title: Username
          type: string
      required:
      - username
      - password
      title: LoginRequest
      type: object
    ModelRef:
      additionalProperties: false
      properties:
        model_id:
          title: Model Id
          type: string
        version:
          title: Version
          type: string
      required:
      - model_id
      - version
      title: ModelRef
      type: object
    PatientEntry:
      additionalProperties: false
      description: A patient of a facility, as the demo patient directory lists them.
      properties:
        age_years:
          minimum: 0.0
          title: Age Years
          type: integer
        hdt_id:
          title: Hdt Id
          type: string
        initials:
          title: Initials
          type: string
        language:
          enum:
          - en
          - yo
          - ha
          - ig
          - pcm
          title: Language
          type: string
        sex:
          enum:
          - female
          - male
          title: Sex
          type: string
        tenant_id:
          enum:
          - fac-a
          - fac-b
          title: Tenant Id
          type: string
      required:
      - hdt_id
      - initials
      - sex
      - age_years
      - language
      - tenant_id
      title: PatientEntry
      type: object
    PatientMessage:
      additionalProperties: false
      properties:
        audio_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Ref
        channel:
          default: app
          enum:
          - app
          - sms
          - ussd
          - voice
          - web
          title: Channel
          type: string
        language:
          enum:
          - en
          - yo
          - ha
          - ig
          - pcm
          title: Language
          type: string
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
      required:
      - language
      title: PatientMessage
      type: object
    PatientReply:
      additionalProperties: false
      properties:
        audio_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Ref
        grounded_on:
          items:
            type: string
          title: Grounded On
          type: array
        language:
          enum:
          - en
          - yo
          - ha
          - ig
          - pcm
          title: Language
          type: string
        reply:
          title: Reply
          type: string
      required:
      - reply
      - language
      title: PatientReply
      type: object
    PatientSummary:
      additionalProperties: false
      properties:
        audio_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Ref
        language:
          enum:
          - en
          - yo
          - ha
          - ig
          - pcm
          title: Language
          type: string
        text:
          title: Text
          type: string
      required:
      - language
      - text
      title: PatientSummary
      type: object
    PopulateRequest:
      properties:
        hdt_id:
          title: Hdt Id
          type: string
      required:
      - hdt_id
      title: PopulateRequest
      type: object
    PreferenceWeights:
      additionalProperties: false
      properties:
        hdt_id:
          title: Hdt Id
          type: string
        weights:
          additionalProperties:
            type: number
          title: Weights
          type: object
      required:
      - hdt_id
      - weights
      title: PreferenceWeights
      type: object
    Preferences:
      additionalProperties: false
      properties:
        answers:
          additionalProperties: true
          title: Answers
          type: object
      required:
      - answers
      title: Preferences
      type: object
    PurposeOfUse:
      enum:
      - care
      - emergency
      - research
      - public_health
      - operations
      - self_management
      title: PurposeOfUse
      type: string
    Recommendation:
      additionalProperties: false
      properties:
        autonomy_level:
          $ref: '#/components/schemas/AutonomyLevel'
        bundle_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Bundle Id
        confidence:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Confidence
        created_by_agent:
          title: Created By Agent
          type: string
        episode_id:
          anyOf:
