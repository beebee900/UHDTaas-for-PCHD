components:
  schemas:
    ContributeArgs:
      additionalProperties: false
      properties:
        contract:
          enum:
          - cohort_contribution
          - registry_case
          title: Contract
          type: string
        records:
          items:
            additionalProperties: true
            type: object
          minItems: 1
          title: Records
          type: array
      required:
      - contract
      - records
      title: ContributeArgs
      type: object
    ContributeData:
      additionalProperties: false
      properties:
        accepted:
          minimum: 0
          title: Accepted
          type: integer
        k:
          minimum: 1
          title: K
          type: integer
        suppressed:
          minimum: 0
          title: Suppressed
          type: integer
      required:
      - accepted
      - suppressed
      - k
      title: ContributeData
      type: object
    NormRow:
      additionalProperties: false
      properties:
        field:
          title: Field
          type: string
        n:
          minimum: 0
          title: N
          type: integer
        p05:
          title: P05
          type: number
        p50:
          title: P50
          type: number
        p95:
          title: P95
          type: number
        unit:
          title: Unit
          type: string
      required:
      - field
      - unit
      - p05
      - p50
      - p95
      - n
      title: NormRow
      type: object
    NormsArgs:
      additionalProperties: false
      properties:
        age_band:
          title: Age Band
          type: string
        fields:
          items:
            type: string
          minItems: 1
          title: Fields
          type: array
        sex:
          enum:
          - female
          - male
          title: Sex
          type: string
      required:
      - fields
      - age_band
      - sex
      title: NormsArgs
      type: object
    NormsData:
      additionalProperties: false
      properties:
        norms:
          items:
            $ref: '#/components/schemas/NormRow'
          title: Norms
          type: array
      required:
      - norms
      title: NormsData
      type: object
    PriorRow:
      additionalProperties: false
      properties:
        age_band:
          title: Age Band
          type: string
        condition:
          title: Condition
          type: string
        prevalence:
          maximum: 1
          minimum: 0
          title: Prevalence
          type: number
        region:
          title: Region
          type: string
        season:
          title: Season
          type: string
        source:
          title: Source
          type: string
      required:
      - condition
      - prevalence
      - age_band
      - season
      - region
      - source
      title: PriorRow
      type: object
    PriorsArgs:
      additionalProperties: false
      properties:
        age_band:
          title: Age Band
          type: string
        conditions:
          items:
            type: string
          minItems: 1
          title: Conditions
          type: array
        region:
          title: Region
          type: string
        season:
          enum:
          - dry
          - rainy
          title: Season
          type: string
        sex:
          enum:
          - female
          - male
          title: Sex
          type: string
      required:
      - conditions
      - age_band
      - sex
      - region
      - season
      title: PriorsArgs
      type: object
    PriorsData:
      additionalProperties: false
      properties:
        priors:
          items:
            $ref: '#/components/schemas/PriorRow'
          title: Priors
          type: array
      required:
      - priors
      title: PriorsData
      type: object
info:
  description: 'Population twin: priors, norms, cohorts and contributions'
  title: Population twin
  version: 1.0.0
openapi: 3.1.0
paths:
  /.well-known/jwks.json:
    get:
      operationId: jwks__well_known_jwks_json_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Jwks  Well Known Jwks Json Get
                type: object
          description: Successful Response
      summary: Jwks
      tags:
      - operations
  /health:
    get:
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Health Get
                type: object
          description: Successful Response
      summary: Health
      tags:
      - operations
  /v1/tools/population.contribute:
    post:
      operationId: population_contribute_v1_tools_population_contribute_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContributeArgs'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributeData'
          description: Tool result
      summary: De-identified contribution, stored only when k-anonymity holds
      tags:
      - tools
  /v1/tools/population.norms:
    post:
      operationId: population_norms_v1_tools_population_norms_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormsArgs'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormsData'
          description: Tool result
      summary: Population percentiles of a field by age band and sex
      tags:
      - tools
  /v1/tools/population.priors:
    post:
      operationId: population_priors_v1_tools_population_priors_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorsArgs'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorsData'
          description: Tool result
      summary: Condition prevalence priors by age band, sex, region and season
      tags:
      - tools
