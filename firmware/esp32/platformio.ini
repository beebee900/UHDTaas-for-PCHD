; ATRA ESP32 sensor board (design 04, 4.1.3). `pio run` builds the board image; `pio test -e
; native` runs the unit tests of lib/atra_wire on the host. Running on a board is person
; action P8.
[platformio]
default_envs = esp32dev

[env]
build_flags = -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11
test_framework = unity

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
test_ignore = *

[env:native]
platform = native
build_src_filter = -<*>
build_flags = ${env.build_flags} -DUNITY_INCLUDE_DOUBLE
