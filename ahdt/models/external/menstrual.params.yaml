# Menstrual cycle hormones (Roeblitz et al. 2013), BioModels BIOMD0000000494.
model_id: ahdt.reproductive.menstrual_and_fertility_cycle
sources:
- id: roeblitz2013
  citation: "Röblitz S, Stötzel C, Deuflhard P, Jones HM, Azulay DO, van der Graaf PH,
    Martin SW. A mathematical model of the human menstrual cycle for the administration of
    GnRH analogues. J Theor Biol. 2013;321:8-27. doi:10.1016/j.jtbi.2012.11.020"
  via: "BioModels BIOMD0000000494, curated, CC0 1.0, SBML L2V4, sha256 7eb01f255157c04ff346d8df279283b5735bee751f9167c31948d3fbfeaf81fe; units from the ZIB report 11-16 (Fig. 4)"
  url: https://www.ebi.ac.uk/biomodels/BIOMD0000000494
- id: atra-assumption
  citation: ATRA design 01 rule R5 assumption register
params:
  agonist_dose: {value: 0, unit: '1', source: atra-assumption, assumption: true,
                 justification: "The pinned model schedules a Nafarelin dose; the twin models a
                   cycle without GnRH analogues, so the dose is set to zero"}
  antagonist_dose: {value: 0, unit: '1', source: atra-assumption, assumption: true,
                    justification: "The pinned model schedules a Cetrorelix dose; the twin models a
                      cycle without GnRH analogues, so the dose is set to zero"}
  lh_surge_threshold: {value: 10, unit: mIU/mL, source: atra-assumption, assumption: true,
                       justification: "Serum LH above this value marks the ovulatory surge in the
                         model output (baseline about 3 mIU/mL, surge peak near 100 mIU/mL); a modelling
                         choice for the cycle phase code"}
  luteal_p4_threshold: {value: 3, unit: ng/mL, source: atra-assumption, assumption: true,
                        justification: "Serum progesterone above this value marks the luteal
                          phase; the usual clinical cut-off for confirming ovulation, to be
                          sourced before sign-off"}
