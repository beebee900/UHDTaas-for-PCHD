  ceftriaxone_renal_clearance: {value: 0.525, unit: L/h, source: atra-assumption, assumption: true,
                                justification: "Midpoint of the label range of 0.32 to 0.73 L/h for renal clearance"}
  ceftriaxone_nonrenal_clearance: {value: 0.49, unit: L/h, source: atra-assumption, assumption: true,
                                   justification: "Total plasma clearance (midpoint 1.015 L/h of the label range
