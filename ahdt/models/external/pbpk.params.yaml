  metformin_vss: {value: 360, unit: L, source: atra-assumption, assumption: true,
                  justification: "The label gives an apparent volume V/F of 654 L; multiplying by the
                    bioavailability of 0.55 gives the steady-state volume used to scale the tissue partition
                    coefficients"}
  metformin_renal_clearance: {value: 36, unit: L/h, source: fda-metformin, note: "Table 4, healthy non-diabetic adults, 500 mg single dose (n=24), mean 600 mL/min"}
  metformin_nonrenal_clearance: {value: 0, unit: L/h, source: fda-metformin, note: "excreted unchanged, no hepatic metabolism or biliary excretion"}
  metformin_ka: {value: 0.27, unit: 1/h, source: atra-assumption, assumption: true,
