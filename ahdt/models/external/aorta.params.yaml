# Aortic segment: one-dimensional blood flow solved by a physics-informed neural network.
model_id: ahdt.cardiovascular.aorta
sources:
- id: kissas2020
  citation: "Kissas G, Yang Y, Hwuang E, Witschey WR, Detre JA, Perdikaris P. Machine learning in
    cardiovascular flows modeling: predicting arterial blood pressure from non-invasive 4D flow
    MRI data using physics-informed neural networks. Comput Methods Appl Mech Eng.
    2020;358:112623. doi:10.1016/j.cma.2019.112623"
  via: "arXiv:1905.04817v2, equation (1) and Section 3.1.2 (blood density and viscosity)"
  url: https://arxiv.org/abs/1905.04817
- id: icrp89
  citation: "Valentin J, editor. Basic anatomical and physiological data for use in radiological
    protection: reference values. ICRP Publication 89. Ann ICRP. 2002;32(3-4)."
  via: "Table 7.1, vessel diameter of the ascending aorta, 2.0 to 3.2 cm"
- id: atra-assumption
  citation: ATRA design 01 rule R5 assumption register
params:
  rho: {value: 1060, unit: kg/m3, source: kissas2020, note: "blood density"}
  mu: {value: 0.0035, unit: Pa.s, source: kissas2020, note: "blood viscosity, 3.5 mPa.s"}
  alpha: {value: 1.1, unit: '1', source: kissas2020, note: "momentum flux correction factor"}
  friction_coefficient: {value: 22, unit: '1', source: kissas2020, note: "K_R = -22 pi mu, divided here by rho"}
  diameter_m: {value: 0.026, unit: m, source: icrp89, note: "midpoint of 2.0 to 3.2 cm"}
  length_m: {value: 0.25, unit: m, source: atra-assumption, assumption: true,
             justification: "Length of the modelled segment; a modelling choice, to be replaced by
               the length from the person's imaging"}
  wave_speed: {value: 5.0, unit: m/s, source: atra-assumption, verified: false,
               justification: "Pulse wave speed c0 of the segment, which sets the wall stiffness
                 beta = 2 rho c0^2 / sqrt(A0); a typical healthy adult aortic value that still
                 needs a cited source"}
  systole_s: {value: 0.3, unit: s, source: atra-assumption, assumption: true,
              justification: "Duration of the half-sine inflow pulse of the ejection"}
  period_s: {value: 0.857, unit: s, source: atra-assumption, assumption: true,
             justification: "Cardiac period of the trained beat, 70 beats per minute"}
  stroke_volume_ml: {value: 70, unit: mL, source: atra-assumption, assumption: true,
                     justification: "Stroke volume of the trained beat, the inflow integral"}
