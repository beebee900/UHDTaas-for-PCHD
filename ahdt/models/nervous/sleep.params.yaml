# Two-process model of sleep regulation.
model_id: ahdt.nervous.circadian_rhythm_and_sleep
sources:
- id: daan1984
  citation: "Daan S, Beersma DG, Borbely AA. Timing of human sleep: recovery process gated by a
    circadian pacemaker. Am J Physiol. 1984;246(2 Pt 2):R161-R183.
    doi:10.1152/ajpregu.1984.246.2.R161"
- id: skeldon2014
  citation: "Skeldon AC, Dijk DJ, Derks G. Mathematical models for sleep-wake dynamics:
    comparison of the two-process model and a mutual inhibition neuronal model. PLoS One.
    2014;9(8):e103877. doi:10.1371/journal.pone.0103877"
  via: "Parameter set stated as 'as in Daan et al. 1984, Figure 3' (arXiv:1311.1734)"
  url: https://arxiv.org/abs/1311.1734
params:
  chi_w: {value: 18.2, unit: h, source: skeldon2014, note: rise time constant while awake}
  chi_s: {value: 4.2, unit: h, source: skeldon2014, note: decay time constant while asleep}
  mu: {value: 1.0, unit: '1', source: skeldon2014, note: upper asymptote}
  H0_plus: {value: 0.60, unit: '1', source: skeldon2014, calibrate: true, prior_cv: 0.15,
            note: mean upper threshold}
  H0_minus: {value: 0.17, unit: '1', source: skeldon2014, note: mean lower threshold}
  a: {value: 0.10, unit: '1', source: skeldon2014, note: circadian amplitude}
  period: {value: 24.0, unit: h, source: skeldon2014}
  alpha: {value: 0.0, unit: h, source: skeldon2014, calibrate: true, assumption: true,
          justification: "Circadian phase offset; Skeldon et al. plot sin(omega t). It is fitted
            to the person's sleep diary or wearable sleep data"}
