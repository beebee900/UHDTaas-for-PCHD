# T3 reference-state items of the immune lymphatic twin (design 04, 4.5.3).
- model_id: ahdt.immune_lymphatic.spleen_thymus_lymph_nodes_and_tonsils
  twin: immune_lymphatic
  intended_use: Lymphoid organ activity and splenic red cell clearance
  instances:
  - UBERON:0002106
  - UBERON:0002370
  - UBERON:0000029
  - UBERON:0002372
  variables:
    immune_activity:
      unit: '1'
      ref: state.immune_activity
      tau_h: 48
      justification: Relaxation time constant of a T3 state; a modelling assumption (design 01, rule
        R3)
    t_cell_output:
      unit: '1'
      ref: state.t_cell_output
      tau_h: 720
      justification: Relaxation time constant of a T3 state; a modelling assumption (design 01, rule
        R3)
    clearance_rate:
      unit: '1'
      ref: state.clearance_rate
      tau_h: 48
      justification: Relaxation time constant of a T3 state; a modelling assumption (design 01, rule
        R3)
  couplings:
  - input: inflammation_index
    from: model:ahdt.immune_lymphatic.inflammation#inflammation_index
    unit: '1'
    target: immune_activity
    gain: coupling.immune_lymphatic.spleen_thymus_lymph_nodes_and_tonsils.inflammation_index.immune_activity.gain
    reference: coupling.immune_lymphatic.spleen_thymus_lymph_nodes_and_tonsils.inflammation_index.immune_activity.reference
  - input: parasitaemia
    from: model:ahdt.immune_lymphatic.infection_response#parasitaemia
    unit: '%'
    target: clearance_rate
    gain: coupling.immune_lymphatic.spleen_thymus_lymph_nodes_and_tonsils.parasitaemia.clearance_rate.gain
    reference: coupling.immune_lymphatic.spleen_thymus_lymph_nodes_and_tonsils.parasitaemia.clearance_rate.reference
