# Platelet production and consumption.
model_id: ahdt.haematological.platelets
sources:
- id: harker1969
  citation: "Harker LA, Finch CA. Thrombokinetics in man. J Clin Invest. 1969;48(6):963-974.
    doi:10.1172/JCI106077"
- id: atra-assumption
  citation: ATRA design 01 rule R5 assumption register
params:
  lifespan: {value: 9.9, unit: d, source: harker1969, verified: false,
             justification: "Normal platelet survival of about 10 days as recalled from Harker
               and Finch; needs a check against the paper"}
  feedback_gain: {value: 1.0, unit: '1', source: atra-assumption, assumption: true,
                  justification: "Thrombopoietin feedback: production rises in proportion to
                    the relative platelet deficit; no published gain for this reduced form"}
  maturation_days: {value: 5, unit: d, source: atra-assumption, assumption: true,
                    justification: "Megakaryocyte maturation delay as a two-stage chain; to be
                      sourced"}
