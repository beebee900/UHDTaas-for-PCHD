    from: model:ahdt.integumentary.wound_healing#wound_area
    unit: cm2
    target: barrier_integrity
    gain: coupling.integumentary.skin_hair_nails_sweat_and_sebaceous_glands.wound_area.barrier_integrity.gain
    reference: coupling.integumentary.skin_hair_nails_sweat_and_sebaceous_glands.wound_area.barrier_integrity.reference
