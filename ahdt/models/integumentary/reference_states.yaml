  intended_use: Skin barrier integrity state
  instances:
  - UBERON:0002097
  variables:
    barrier_integrity:
      unit: '1'
      ref: state.barrier_integrity
      tau_h: 72
      justification: Relaxation time constant of a T3 state; a modelling assumption (design 01, rule
        R3)
  couplings:
