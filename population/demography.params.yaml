# Cohort-component projection with Lagos-like rates (design 04, 4.5.3: demographic).
# Every rate is an assumption: no Lagos life table, fertility or migration table was sourced.
model_id: ahdt.population.demographic
sources:
- id: atra-assumption
  citation: ATRA design 01 rule R5 assumption register
params:
  asfr_15_19: {value: 0.06, unit: /a, source: atra-assumption, assumption: true,
               justification: "Births per woman per year at 15 to 19; the seven age-specific
                 rates give a total fertility of 3.5, a Lagos-like urban level."}
  asfr_20_24: {value: 0.15, unit: /a, source: atra-assumption, assumption: true,
               justification: Part of the assumed total fertility of 3.5.}
  asfr_25_29: {value: 0.17, unit: /a, source: atra-assumption, assumption: true,
               justification: Part of the assumed total fertility of 3.5.}
  asfr_30_34: {value: 0.15, unit: /a, source: atra-assumption, assumption: true,
               justification: Part of the assumed total fertility of 3.5.}
  asfr_35_39: {value: 0.11, unit: /a, source: atra-assumption, assumption: true,
               justification: Part of the assumed total fertility of 3.5.}
  asfr_40_44: {value: 0.05, unit: /a, source: atra-assumption, assumption: true,
               justification: Part of the assumed total fertility of 3.5.}
  asfr_45_49: {value: 0.01, unit: /a, source: atra-assumption, assumption: true,
