# Community-acquired pneumonia. Adults: AWaRe chapter 12 (page 166); children: page 168.
# Severity for adults follows CURB-65 (severity.pneumonia.curb65).

- id: tx.pneumonia.adult_mild.amoxicillin
  condition: cond.pneumonia_community
  severity: mild
  preference: first_line
  regimen: dose.amoxicillin_oral_adult_cap
  duration_days: 5
  eligibility: {patient_group: adult, oral_intake: true}
  provenance:
    source: who-aware-2022
    section: 12. Community-acquired pneumonia – mild
    page: 166
    extracted_by: llm
    verified_by: second_pass
    status: verified

