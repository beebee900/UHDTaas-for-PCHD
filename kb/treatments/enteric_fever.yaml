# Enteric fever. The empiric choice depends on severity and on the local risk of
# fluoroquinolone resistance in Salmonella Typhi and Paratyphi (`fq_resistance_risk`).

- id: tx.enteric_fever.adult.low_fq_risk.ciprofloxacin
  condition: cond.enteric_fever
  severity: [mild, severe]
  preference: first_line
  regimen: dose.ciprofloxacin_oral_adult
  duration_days: {mild: 7, severe: 10}
  eligibility: {patient_group: adult, fq_resistance_risk: low, oral_intake: true, pregnancy: [none]}
  exclusions: [ix.quinolones.pregnancy]
  provenance:
    source: who-aware-2022
    section: 15. Enteric fever
    page: 202
    extracted_by: llm
    verified_by: second_pass
    status: verified

