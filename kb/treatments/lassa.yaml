# Lassa fever (NCDC 2018). Ribavirin starts for probable cases while PCR is awaited.

- id: tx.lassa.adult.ribavirin_mccormick
  condition: cond.lassa_fever
  severity: [suspected, confirmed]
  preference: first_line
  regimen: dose.ribavirin_iv_mccormick
  eligibility: {patient_group: adult, pregnancy: [none]}
  empirical_allowed: true
  provenance:
    source: ncdc-lassa-2018
    section: 2.1.2 Probable Case
    page: 12
    also:
    - {source: ncdc-lassa-2018, section: 3.2 Drug Treatment of Lassa fever, page: 14}
    extracted_by: llm
    verified_by: second_pass
    status: verified

