- id: tx.pyelonephritis.adult_mild.ciprofloxacin
  condition: cond.pyelonephritis
  severity: mild
  preference: first_line
  regimen: dose.ciprofloxacin_oral_adult
  duration_days: 7
  eligibility: {patient_group: adult, pregnancy: [none], oral_intake: true}
  exclusions: [ix.quinolones.pregnancy]
  provenance:
    source: who-aware-2022
    section: 34. Upper urinary tract infection
    page: 493
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: tx.pyelonephritis.adult_severe.third_generation_cephalosporin
  condition: cond.pyelonephritis
  severity: severe
  preference: first_line
  regimen: [dose.ceftriaxone_iv_adult_uti, dose.cefotaxime_iv_adult]
  duration_days: 7
  eligibility: {patient_group: adult, pregnancy: [none]}
  add_on: {regimen: [dose.amikacin_iv, dose.gentamicin_iv_adult],
           when: very sick patient or high local ESBL prevalence}
  provenance:
    source: who-aware-2022
    section: 34. Upper urinary tract infection
    page: 493
    extracted_by: llm
    verified_by: second_pass
    status: verified

