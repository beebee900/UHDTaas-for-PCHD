# Urinary tract infection. Adults and children follow AWaRe (2022); pregnancy follows the IMAI
# district clinician manual, which treats pyelonephritis in pregnancy as severe.

- id: tx.cystitis.adult.amoxicillin_clavulanate
  condition: cond.cystitis
  severity: uncomplicated
  preference: first_line
  regimen: dose.amoxicillin_clavulanate_oral_adult_lower_uti
  eligibility: {patient_group: adult, pregnancy: [none], oral_intake: true}
  provenance:
    source: who-aware-2022
    section: 23. Lower urinary tract infection
    page: 297
    extracted_by: llm
    verified_by: second_pass
    status: verified

