# Treatment options for P. falciparum malaria. The rule engine offers an option when every
# eligibility condition holds and no exclusion applies. `preference` orders options that are
# eligible together. Pregnancy states: none, t1, t2, t3 (trimesters).

- id: tx.malaria.uncomplicated.artemether_lumefantrine
  condition: cond.malaria_falciparum
  severity: uncomplicated
  preference: first_line
  regimen: dose.artemether_lumefantrine
  eligibility: {oral_intake: true, pregnancy: [none, t1, t2, t3]}
  note: The recommended ACT in the first trimester of pregnancy.
  provenance:
    source: who-malaria-2026
    section: 5.2.1.4.1 Pregnant and lactating women
    page: 183
    also:
    - {source: who-malaria-2026, section: 5.2.1.1 Artemisinin-based combination therapy,
       page: 171}
    extracted_by: llm
    verified_by: second_pass
    status: verified

