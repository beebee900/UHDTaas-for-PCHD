- id: tx.asthma.exacerbation
  condition: cond.asthma
  severity: [exacerbation_mild, exacerbation_severe]
  preference: first_line
  regimen: [dose.prednisolone_asthma_exacerbation, dose.salbutamol_exacerbation]
  second_line: Increase salbutamol frequency or continuous nebulization; in children add nebulized
    ipratropium if available.
  provenance:
    source: who-pen-2020
    page: 42
    also:
    - {source: who-pen-2020, page: 43}
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: tx.copd.exacerbation
  condition: cond.copd_exacerbation
  severity: [severe]
  preference: first_line
  regimen: [dose.prednisolone_copd_exacerbation, dose.salbutamol_exacerbation]
  oxygen: Through a mask that limits the concentration to 24% or 28%.
  provenance:
    source: who-pen-2020
    page: 45
    extracted_by: llm
    verified_by: second_pass
    status: verified

