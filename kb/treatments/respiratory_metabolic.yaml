- id: tx.hyperglycaemic_crisis.refer
  condition: cond.hyperglycaemic_crisis
  severity: [ketoacidosis, hyperosmolar]
  preference: first_line
  regimen: null
  action: refer_urgently
  criteria:
    dka: {glucose_at_or_above_mmol_l: 13.9, ketones: positive}
    hhs: {glucose_at_or_above_mmol_l: 33.3, ketones: negative or weakly positive}
  note: Life-threatening; refer to a higher level of care. Urine ketones 2+ or more in a severely
    hyperglycaemic person lead to referral.
  provenance:
    source: who-hearts-d-2020
    page: 19
    also:
    - {source: who-hearts-d-2020, page: 16}
    extracted_by: llm
    verified_by: second_pass
    status: verified
