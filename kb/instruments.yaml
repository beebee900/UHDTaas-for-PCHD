# Item text, answer options and scoring of validated self-report instruments. The
# questionnaire builder (`sourcing questionnaires`) turns each entry into a FHIR Questionnaire.

- id: instrument.phq9
  title: Patient Health Questionnaire (PHQ-9)
  loinc: 44261-6
  stem: Over the last 2 weeks, how often have you been bothered by any of the following?
  options:
  - {code: '0', display: Not at all, score: 0}
  - {code: '1', display: Several days, score: 1}
  - {code: '2', display: More than half the days, score: 2}
  - {code: '3', display: Nearly every day, score: 3}
  items:
  - {id: a, text: Little interest or pleasure in doing things}
  - {id: b, text: 'Feeling down, depressed, or hopeless'}
  - {id: c, text: 'Trouble falling or staying asleep, or sleeping too much'}
  - {id: d, text: Feeling tired or having little energy}
  - {id: e, text: Poor appetite or overeating}
  - {id: f, text: Feeling bad about yourself or that you are a failure or have let yourself or your family down}
  - {id: g, text: 'Trouble concentrating on things, such as reading the newspaper or watching television'}
  - {id: h, text: Moving or speaking so slowly that other people could have noticed, or the opposite, being so fidgety or restless that you have been moving around a lot more than usual}
  - {id: i, text: Thoughts that you would be better off dead or of hurting yourself in some way, safety_item: true}
  total: {min: 0, max: 27, severity_rule: severity.phq9}
  provenance:
    source: phq-manual
    section: Purposes
    page: 5
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: instrument.gad7
  title: Generalized Anxiety Disorder 7-item scale (GAD-7)
  loinc: 70274-6
  stem: Over the last 2 weeks, how often have you been bothered by the following problems?
  options:
  - {code: '0', display: Not at all, score: 0}
  - {code: '1', display: Several days, score: 1}
  - {code: '2', display: More than half the days, score: 2}
  - {code: '3', display: Nearly every day, score: 3}
  items:
  - {id: '1', text: 'Feeling nervous, anxious or on edge'}
  - {id: '2', text: Not being able to stop or control worrying}
  - {id: '3', text: Worrying too much about different things}
  - {id: '4', text: Trouble relaxing}
  - {id: '5', text: Being so restless that it is hard to sit still}
  - {id: '6', text: Becoming easily annoyed or irritable}
  - {id: '7', text: Feeling afraid as if something awful might happen}
  total: {min: 0, max: 21, severity_rule: severity.gad7}
  provenance:
    source: gad7-form
    page: 1
    derived:
      total.max: Seven items scored 0 to 3.
    extracted_by: llm
    verified_by: second_pass
    status: verified

# Item response scores follow the form: 5 is the best health on every item. Global07r is
# answered on 0 to 10 and recoded to 1 to 5 before scoring. Global01 and Global09r are
# reported as raw responses and belong to no summary score.
- id: instrument.promis10
  title: PROMIS Scale v1.2, Global Health (PROMIS-10)
  loinc: 85524-7
  stem: Please respond to each question or statement by marking one box per row.
  options:
  - {code: '5', display: Excellent, score: 5}
  - {code: '4', display: Very good, score: 4}
  - {code: '3', display: Good, score: 3}
  - {code: '2', display: Fair, score: 2}
  - {code: '1', display: Poor, score: 1}
  items:
  - {id: Global01, text: 'In general, would you say your health is:'}
  - {id: Global02, text: 'In general, would you say your quality of life is:'}
  - {id: Global03, text: 'In general, how would you rate your physical health?'}
  - {id: Global04, text: 'In general, how would you rate your mental health, including your mood and your ability to think?'}
  - {id: Global05, text: 'In general, how would you rate your satisfaction with your social activities and relationships?'}
  - {id: Global09r, text: 'In general, please rate how well you carry out your usual social activities and roles. (This includes activities at home, at work and in your community, and responsibilities as a parent, child, spouse, employee, friend, etc.)'}
  - id: Global06
    text: To what extent are you able to carry out your everyday physical activities such as walking, climbing stairs, carrying groceries, or moving a chair?
    options:
    - {code: '5', display: Completely, score: 5}
    - {code: '4', display: Mostly, score: 4}
    - {code: '3', display: Moderately, score: 3}
    - {code: '2', display: A little, score: 2}
    - {code: '1', display: Not at all, score: 1}
  - id: Global10r
    prefix: In the past 7 days...
    text: How often have you been bothered by emotional problems such as feeling anxious, depressed or irritable?
    options:
    - {code: '5', display: Never, score: 5}
    - {code: '4', display: Rarely, score: 4}
    - {code: '3', display: Sometimes, score: 3}
    - {code: '2', display: Often, score: 2}
    - {code: '1', display: Always, score: 1}
  - id: Global08r
    prefix: In the past 7 days...
    text: How would you rate your fatigue on average?
    options:
    - {code: '5', display: None, score: 5}
    - {code: '4', display: Mild, score: 4}
    - {code: '3', display: Moderate, score: 3}
    - {code: '2', display: Severe, score: 2}
    - {code: '1', display: Very severe, score: 1}
  - id: Global07r
    prefix: In the past 7 days...
    text: How would you rate your pain on average?
    options:
    - {code: '0', display: 0 No pain, score: 5}
    - {code: '1', display: '1', score: 4}
    - {code: '2', display: '2', score: 4}
    - {code: '3', display: '3', score: 4}
    - {code: '4', display: '4', score: 3}
    - {code: '5', display: '5', score: 3}
    - {code: '6', display: '6', score: 3}
    - {code: '7', display: '7', score: 2}
    - {code: '8', display: '8', score: 2}
    - {code: '9', display: '9', score: 2}
    - {code: '10', display: 10 Worst pain imaginable, score: 1}
  scores:
  - id: global_physical
    title: Global Physical Health T-score
    loinc: 71971-6
    items: [Global03, Global06, Global07r, Global08r]
    t_score: {4: 16.2, 5: 19.9, 6: 23.5, 7: 26.7, 8: 29.6, 9: 32.4, 10: 34.9, 11: 37.4,
              12: 39.8, 13: 42.3, 14: 44.9, 15: 47.7, 16: 50.8, 17: 54.1, 18: 57.7,
              19: 61.9, 20: 67.7}
    se: {4: 4.8, 5: 4.7, 6: 4.5, 7: 4.3, 8: 4.2, 9: 4.2, 10: 4.1, 11: 4.1, 12: 4.1,
         13: 4.2, 14: 4.3, 15: 4.4, 16: 4.6, 17: 4.7, 18: 4.9, 19: 5.2, 20: 5.9}
  - id: global_mental
    title: Global Mental Health T-score
    loinc: 71969-0
    items: [Global02, Global04, Global05, Global10r]
    t_score: {4: 21.2, 5: 25.1, 6: 28.4, 7: 31.3, 8: 33.8, 9: 36.3, 10: 38.8, 11: 41.1,
              12: 43.5, 13: 45.8, 14: 48.3, 15: 50.8, 16: 53.3, 17: 56.0, 18: 59.0,
              19: 62.5, 20: 67.6}
    se: {4: 4.6, 5: 4.1, 6: 3.9, 7: 3.7, 8: 3.7, 9: 3.7, 10: 3.6, 11: 3.6, 12: 3.6,
         13: 3.6, 14: 3.7, 15: 3.7, 16: 3.7, 17: 3.8, 18: 3.9, 19: 4.2, 20: 5.3}
  provenance:
    source: promis-10
    page: 1
    also:
    - {source: promis-gh-scoring-2024, page: 8}
    derived:
      scores[*].t_score.*: Conversion tables on pages 9 and 10 of the scoring manual, read from the rendered page images.
      scores[*].se.*: Conversion tables on pages 9 and 10 of the scoring manual, read from the rendered page images.
      items[*].options[*].score: Global07r recode on page 9 of the scoring manual, read from the rendered page image.
    extracted_by: llm
    verified_by: second_pass
    status: verified
