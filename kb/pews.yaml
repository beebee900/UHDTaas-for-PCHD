# Paediatric early warning score: the NHS England national PEWS (2023), chosen because its four
# age charts and escalation levels are published openly and cover 0 to 18 years.
# The chart shows score bands as coloured cells (0 white, 1 yellow, 2 orange, 4 pink) between grid
# lines. Each band is [min, max] on the grid; a value on a grid line touches two bands and scores
# the higher one. Temperature is not scored; it feeds the sepsis prompt only.

- id: pews.version
  name: NHS England national paediatric early warning system (PEWS), September 2023
  charts: [nhse-pews-0-11m, nhse-pews-1-4y, nhse-pews-5-12y, nhse-pews-13y]
  provenance:
    source: nhse-pews-1-4y
    page: 1
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: pews.scoring.0_11m
  age_min_months: 0
  age_max_months: 11
  respiration_rate:
  - {max: 10, score: 4}
  - {min: 10, max: 20, score: 2}
  - {min: 20, max: 30, score: 1}
  - {min: 30, max: 50, score: 0}
  - {min: 50, max: 60, score: 1}
  - {min: 60, max: 70, score: 2}
  - {min: 70, score: 4}
  heart_rate:
  - {max: 80, score: 4}
  - {min: 80, max: 90, score: 2}
  - {min: 90, max: 110, score: 1}
  - {min: 110, max: 150, score: 0}
  - {min: 150, max: 170, score: 1}
  - {min: 170, max: 180, score: 2}
  - {min: 180, score: 4}
  systolic_bp:
  - {max: 50, score: 4}
  - {min: 50, max: 60, score: 2}
  - {min: 60, max: 70, score: 1}
  - {min: 70, max: 90, score: 0}
  - {min: 90, max: 100, score: 1}
  - {min: 100, max: 110, score: 2}
  - {min: 110, score: 4}
  provenance:
    source: nhse-pews-0-11m
    page: 1
    extracted_by: llm
    verified_by: second_pass
    status: verified

