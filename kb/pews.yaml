# Parameters scored the same on every age chart.
- id: pews.scoring.common
  respiratory_distress: {none: 0, mild: 1, moderate: 2, severe: 4}
  spo2: [{min: 95, score: 0}, {min: 92, max: 94, score: 1}, {max: 91, score: 4}]
  oxygen_fio2_percent: [{max: 24, score: 0}, {min: 24, max: 30, score: 1},
                        {min: 30, max: 50, score: 2}, {min: 50, score: 4}]
  oxygen_flow_l_min: [{max: 0.1, score: 0}, {min: 0.1, max: 2, score: 1},
                      {min: 2, max: 6, score: 2}, {min: 6, score: 4}]
  respiratory_support_device: {high_flow: 4, bipap: 4, cpap: 4}
  capillary_refill_s: [{max: 2, score: 0}, {min: 3, score: 2}]
  provenance:
    source: nhse-pews-1-4y
    page: 1
    also:
    - {source: nhse-pews-0-11m, page: 1}
    - {source: nhse-pews-5-12y, page: 1}
    - {source: nhse-pews-13y, page: 1}
    extracted_by: llm
    verified_by: second_pass
    status: verified

# Escalation level by total score, with the triggers that set a level on their own.
# `review_within_min` is the medical review time; `reassess_within_min` the observation interval.
- id: pews.escalation
  levels:
  - {level: low, min_total: 1, max_total: 4, reassess_within_min: 60}
  - {level: medium, min_total: 5, max_total: 8, review_within_min: 30, reassess_within_min: 30}
  - {level: high, min_total: 9, max_total: 12, review_within_min: 15, reassess_within_min: 30,
     continuous_monitoring: true}
  - {level: emergency, min_total: 13, review_within_min: 0, reassess_within_min: 15,
     continuous_monitoring: true}
  triggers:
  - {trigger: new_suspicion_of_sepsis, level: medium}
  - {trigger: avpu_voice, level: high}
  - {trigger: new_suspicion_of_septic_shock, level: high}
  - {trigger: avpu_pain_or_unresponsive, level: emergency}
  - {trigger: abnormal_pupillary_response, level: emergency}
  sepsis_prompt_temperature_c: {at_or_above: 38, below: 36}
  provenance:
    source: nhse-pews-1-4y
    page: 1
    also:
    - {source: nhse-pews-13y, page: 1}
    derived:
      levels[3].review_within_min: Chart wording "Immediate".
    extracted_by: llm
    verified_by: second_pass
    status: verified
