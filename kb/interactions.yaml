- id: ix.sp.folic_acid_high_dose
  kind: drug_drug
  a: sulfadoxine + pyrimethamine
  b: folic acid
  b_dose_mg_per_day_at_least: 5
  severity: high
  effect: Folic acid 5 mg daily significantly reduces the efficacy of SP; 0.4 mg daily does not.
  management: Do not co-administer high-dose folic acid; use 0.4 mg daily or another ACT.
  provenance:
    source: who-malaria-2026
    section: 5.2.1.1.2 Dosing of ACTs
    page: 177
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: ix.piperaquine.high_fat_meal
  kind: drug_food
  a: piperaquine
  b: food.high_fat_meal
  severity: moderate
  effect: Faster piperaquine absorption and a higher risk of QT prolongation.
  management: Take with a normal meal, not a high-fat meal.
  provenance:
    source: who-malaria-2026
    section: 5.2.1.1.2 Dosing of ACTs
    page: 178
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: ix.pyronaridine.liver_disease
  kind: drug_condition
  a: pyronaridine
  b: cond.liver_disease
  severity: high
  effect: Liver transaminitis.
  management: Avoid artesunate-pyronaridine in clinically apparent liver disease.
  provenance:
    source: who-malaria-2026
    section: 5.2.1.1 Artemisinin-based combination therapy
    page: 172
    extracted_by: llm
    verified_by: second_pass
