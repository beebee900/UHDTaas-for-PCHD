# Drug–drug, drug–condition and drug–food interactions. Severity `high` blocks signing until a
# pharmacist resolves it; `moderate` needs an acknowledged management step; `low` is shown only.
# `a` and `b` name drugs by their lower-case INN, or a condition or food by its kb id.

- id: ix.amodiaquine.zidovudine
  kind: drug_drug
  a: amodiaquine
  b: zidovudine
  severity: high
  effect: Severe neutropenia.
  management: Avoid artesunate + amodiaquine unless it is the only ACT promptly available.
  provenance:
    source: who-malaria-2026
    section: 5.2.1.1.2 Dosing of ACTs
    page: 176
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: ix.amodiaquine.cotrimoxazole
  kind: drug_drug
  a: amodiaquine
  b: sulfamethoxazole + trimethoprim
  severity: high
  effect: Severe neutropenia, particularly with HIV co-infection.
  management: Avoid artesunate + amodiaquine unless it is the only ACT promptly available.
  provenance:
    source: who-malaria-2026
    section: 5.2.1.1.2 Dosing of ACTs
    page: 176
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: ix.amodiaquine.efavirenz
  kind: drug_drug
  a: amodiaquine
  b: efavirenz
  severity: high
  effect: Increased amodiaquine exposure and hepatotoxicity.
  management: Avoid artesunate + amodiaquine unless it is the only ACT promptly available.
  provenance:
    source: who-malaria-2026
    section: 5.2.1.1.2 Dosing of ACTs
    page: 176
