    verified_by: second_pass
    status: verified

- id: ix.lumefantrine.rifampicin
  kind: drug_drug
  a: lumefantrine
  b: rifampicin
  severity: moderate
  effect: Decreased lumefantrine exposure and a higher risk of treatment failure.
  management: Monitor the treatment response closely and ensure full adherence.
  provenance:
    source: who-malaria-2026
    section: 5.2.1.1.2 Dosing of ACTs
    page: 176
    extracted_by: llm
