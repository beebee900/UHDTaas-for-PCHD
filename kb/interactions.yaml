- id: ix.primaquine.pregnancy
  kind: drug_condition
  a: primaquine
  b: pregnancy
  severity: high
  effect: Primaquine must not be used in pregnancy.
  management: Withhold primaquine during pregnancy.
  provenance:
    source: who-malaria-2026
    section: 5.2.1.4.1 Pregnant and lactating women
