- id: ix.quinolones.pregnancy
  kind: drug_condition
  a: ciprofloxacin
  atc_class: J01MA
  b: pregnancy
  severity: high
  effect: Quinolones are to be avoided in pregnancy.
  management: Use ceftriaxone, or nitrofurantoin or amoxicillin + clavulanic acid for cystitis.
  provenance:
    source: who-imai-dcm-2011-v2
    page: 517
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: ix.ras_blockers.pregnancy
  kind: drug_condition
  a: angiotensin receptor blockers and ACE inhibitors
  atc_class: [C09A, C09C]
  b: pregnancy
  severity: high
  effect: ACE inhibitors and ARBs must not be given to women who are or may become pregnant.
  management: Use a calcium channel blocker or a thiazide-type diuretic.
  provenance:
    source: who-hearts-protocols-2018
    page: 31
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: ix.metformin.contraindications
  kind: drug_condition
  a: metformin
  b: [egfr_below_30, cond.liver_disease, acute_cardiac_insufficiency, respiratory_insufficiency,
      alcohol_abuse]
  egfr_below: 30
  severity: high
  effect: Metformin is contraindicated in these conditions.
  management: Use a second-generation sulfonylurea (preferably gliclazide) or refer.
  provenance:
    source: who-hearts-d-2020
    page: 15
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: ix.glibenclamide.not_recommended
  kind: drug_condition
  a: glibenclamide
  b: [age_60_or_older, cond.liver_disease, high_hypoglycaemia_risk, drives_for_work]
  age_at_or_above_years: 60
  severity: high
  effect: Higher risk of hypoglycaemia than gliclazide.
  management: Use gliclazide.
  provenance:
    source: who-hearts-d-2020
    page: 15
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: ix.dolutegravir.rifampicin
  kind: drug_drug
  a: dolutegravir
  b: rifampicin
  severity: high
  effect: Rifampicin induces dolutegravir metabolism and lowers its exposure.
  management: Give dolutegravir 50 mg twice daily (an extra 50 mg 12 hours after the regimen) in
    the absence of integrase inhibitor resistance; continue twice daily for two weeks after the
    last rifampicin dose. With integrase inhibitor resistance, avoid the combination.
  dose_mg: 50
  doses_per_day: 2
  continue_after_rifampicin_weeks: 2
  provenance:
    source: who-hiv-2021
    section: 4.6 What to start
    page: 172
    also:
    - {source: who-hiv-2021, page: 175}
    - {source: who-hiv-2021, page: 226}
    derived:
      doses_per_day: Text "twice daily".
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: ix.rifampicin.protease_inhibitors
  kind: drug_drug
  a: rifampicin
  b: [atazanavir + ritonavir, darunavir + ritonavir, lopinavir + ritonavir, nevirapine]
  severity: high
  effect: Rifampicin with protease inhibitors or nevirapine is a key contraindicated combination.
  management: Replace rifampicin with rifabutin 150 mg daily, or double the LPV/r dose; replace
    ATV/r or DRV/r with DTG if DTG-naive.
  rifabutin_mg_per_day: 150
  provenance:
    source: who-hiv-2021
    page: 226
    also:
    - {source: who-hiv-2021, section: Table 4.5 Guidance for adjusting ART when rifampicin-based TB,
       page: 177}
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: ix.rifampicin.tenofovir_alafenamide
  kind: drug_drug
  a: rifampicin
  b: tenofovir alafenamide
  severity: moderate
  effect: Rifampicin reduces tenofovir alafenamide exposure.
  management: Replace TAF with TDF or abacavir when rifampicin-based TB treatment starts.
  provenance:
    source: who-hiv-2021
    page: 177
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: ix.hydroxyurea.contraindications
  kind: drug_condition
  a: hydroxycarbamide
  b: [pregnancy, planning_conception, low_blood_counts, cond.liver_disease, kidney_failure]
  severity: high
  effect: Hydroxyurea is contraindicated in pregnancy, in people planning conception, and with low
    blood counts, liver disease or kidney failure.
  management: Do not start; review at each visit.
  provenance:
    source: ng-scd-2014
    section: 4.1 Hydroxyurea Therapy for Sickle Cell Disease
    page: 41
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: ix.amitriptyline.contraindications
  kind: drug_condition
  a: amitriptyline
  b: [cardiovascular_disease, seizure_history, hyperthyroidism, urinary_retention,
      narrow_angle_glaucoma, bipolar_disorder, suicidal_thoughts_or_plans, age_below_18]
