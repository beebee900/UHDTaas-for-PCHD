  - {phase: days_2_5, mg_per_kg: 16, every_h: 6}
  - {phase: days_6_10, mg_per_kg: 8, every_h: 8}
  administration: Slow intravenous push over 5 to 10 minutes.
  provenance:
    source: ncdc-lassa-2018
    section: 3.3.1 ISTH Regimen for Pregnant women (Modified McCormick regimen)
