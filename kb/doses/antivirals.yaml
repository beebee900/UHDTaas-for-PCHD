# Intravenous ribavirin for Lassa fever (NCDC 2018). Each phase gives mg/kg per dose, the
# maximum per dose and the interval. A loading dose split in two gives 2/3 at once and 1/3 later.

- id: dose.ribavirin_iv_mccormick
  drug: ribavirin
  atc: J05AP01
  route: intravenous
  duration_days: 10
  phases:
  - {phase: loading, mg_per_kg: 33, max_g: 2.64, schedule: stat}
  - {phase: days_1_4, mg_per_kg: 16, max_g: 1.28, every_h: 6}
  - {phase: days_5_10, mg_per_kg: 8, max_g: 0.64, every_h: 8}
  dialysis: Give the dose 4 hours before a dialysis session.
  provenance:
    source: ncdc-lassa-2018
    section: 3.2.1A Adults including non-pregnant adults (McCormick regimen)
    page: 14
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: dose.ribavirin_iv_irrua
  drug: ribavirin
  atc: J05AP01
  route: intravenous
  duration_days: 10
  phases:
  - {phase: loading, mg_per_kg: 100, max_g: 7, schedule: two divided doses 8 hours apart}
  - {phase: days_2_7, mg_per_kg: 25, doses_per_day: 1}
  - {phase: days_8_10, mg_per_kg: 12.5, doses_per_day: 1}
  provenance:
    source: ncdc-lassa-2018
    section: 3.2.1B Adults including non-pregnant adults (Irrua regimen)
    page: 14
    derived:
      phases[*].doses_per_day: Text "Daily (single dose)".
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: dose.ribavirin_iv_pregnancy
  drug: ribavirin
  atc: J05AP01
  route: intravenous
  duration_days: 10
  phases:
