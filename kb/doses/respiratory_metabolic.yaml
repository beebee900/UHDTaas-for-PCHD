- id: dose.glucose_10pc_child_hypoglycaemia
  drug: glucose 10% solution
  atc: B05BA03
  route: intravenous
  ml_per_kg: 5
  bolus_by_age:
  - {age_below_months: 2, below_kg: 4, ml: 15}
  - {age_from_months: 2, age_below_months: 4, min_kg: 4, below_kg: 6, ml: 25}
  - {age_from_months: 4, age_below_months: 12, min_kg: 6, below_kg: 10, ml: 40}
  - {age_from_years: 1, age_below_years: 3, min_kg: 10, below_kg: 14, ml: 60}
  - {age_from_years: 3, age_below_years: 5, min_kg: 14, below_kg: 19, ml: 80}
  treat_if_glucose_below_mmol_l: {well_nourished: 2.5, severely_malnourished: 3}
  then: Recheck glucose in 30 minutes; feed as soon as conscious.
  sublingual_sugar_if_no_iv: One level teaspoon moistened with water under the tongue every 10 to 20 minutes.
  provenance:
    source: who-pocketbook-children-2013
    page: 40
    derived:
      bolus_by_age[*].age_*: Age bands of the table header.
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: dose.hypoglycaemia_adult
  drug: glucose
  atc: B05BA03
  conscious_able_to_swallow:
    oral_glucose_g: [15, 20]
    examples: sugar-sweetened soft drink, 1 to 2 teaspoons of sugar, 5 to 6 hard candies, a cup of milk
    expected_rise_mmol_l: 2.8
    recheck_after_min: 15
    then: A small meal with complex carbohydrate.
  unconscious_or_unable_to_swallow:
    route: intravenous
    ml_of_50_percent_glucose: [20, 50]
    over_min: [1, 3]
  provenance:
    source: who-hearts-d-2020
    page: 19
    extracted_by: llm
    verified_by: second_pass
    status: verified
