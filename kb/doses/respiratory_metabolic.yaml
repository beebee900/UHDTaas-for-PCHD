# Asthma and COPD exacerbations (WHO PEN 2020, read from the rendered pages where the text layer
# is garbled) and hypoglycaemia in children (WHO pocket book 2013).

- id: dose.prednisolone_asthma_exacerbation
  drug: prednisolone
  atc: H02AB06
  route: oral
  adult: {mg_per_day: [30, 40], days: 5}
  child: {mg_per_kg_per_day: 1, days: 3}
  provenance:
    source: who-pen-2020
    page: 42
    derived:
      adult.mg_per_day[*]: Read from the rendered page; the text layer of this page is garbled.
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: dose.salbutamol_exacerbation
  drug: salbutamol
  atc: R03AC02
  route: inhaled
  metered_dose_inhaler: {puffs: 4, every_min: 20, for_h: 1, with: spacer}
  continuous_nebulization_mg_per_h: [5, 10]
  provenance:
    source: who-pen-2020
    page: 43
    derived:
      metered_dose_inhaler.puffs: Text "four puffs".
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: dose.prednisolone_copd_exacerbation
  drug: prednisolone
  atc: H02AB06
  route: oral
  mg_per_day: [30, 40]
