# CPIC gene rules (allele function, diplotype to phenotype) and drug recommendations, from the
# CPIC database (sources.yaml, cpic-api). A citation section reads "<CPIC table>: <filter>".
# Drug recommendations are keyed by phenotype; where CPIC splits them by indication, they are
# keyed by indication first.

- id: pgx.CYP2D6
  method: activity_score
  allele_activity: {"*1": 1.0, "*2": 1.0, "*4": 0.0, "*5": 0.0, "*10": 0.25, "*17": 0.5,
                    "*29": 0.5, "*41": 0.25}
  phenotypes:
  - {phenotype: Poor Metabolizer, max_score: 0.0}
  - {phenotype: Intermediate Metabolizer, max_score: 1.0}
  - {phenotype: Normal Metabolizer, max_score: 2.25}
  - {phenotype: Ultrarapid Metabolizer}
  provenance:
    source: cpic-api
    section: "allele: CYP2D6"
    also:
    - {source: cpic-api, section: "gene_result: CYP2D6"}
    - {source: cpic-cyp2d6-2020, section: Figure 1}
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: pgx.CYP2C19
  method: diplotype_function
  allele_function: {"*1": Normal function, "*2": No function, "*3": No function,
                    "*17": Increased function}
  phenotypes:
  - {phenotype: Ultrarapid Metabolizer, functions: [Increased function, Increased function]}
  - {phenotype: Rapid Metabolizer, functions: [Normal function, Increased function]}
  - {phenotype: Normal Metabolizer, functions: [Normal function, Normal function]}
  - {phenotype: Intermediate Metabolizer, functions: [Normal function, No function]}
  - {phenotype: Intermediate Metabolizer, functions: [Increased function, No function]}
  - {phenotype: Poor Metabolizer, functions: [No function, No function]}
  provenance:
    source: cpic-cyp2c19-2022
    section: "allele: CYP2C19"
    also:
    - {source: cpic-cyp2c19-2022, section: "gene_result: CYP2C19"}
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: pgx.CYP2B6
  method: diplotype_function
  allele_function: {"*1": Normal function, "*6": Decreased function, "*18": No function}
  phenotypes:
  - {phenotype: Normal Metabolizer, functions: [Normal function, Normal function]}
  - {phenotype: Intermediate Metabolizer, functions: [Normal function, Decreased function]}
  - {phenotype: Intermediate Metabolizer, functions: [Normal function, No function]}
  - {phenotype: Poor Metabolizer, functions: [Decreased function, Decreased function]}
  - {phenotype: Poor Metabolizer, functions: [Decreased function, No function]}
  - {phenotype: Poor Metabolizer, functions: [No function, No function]}
  provenance:
    source: cpic-cyp2b6-2019
    section: "allele: CYP2B6"
    also:
    - {source: cpic-cyp2b6-2019, section: "gene_result: CYP2B6"}
    extracted_by: llm
    verified_by: second_pass
    status: verified

# G6PD status usually comes from an enzyme activity test; it is given to the model as a phenotype.
- id: pgx.G6PD
  method: phenotype_input
  phenotypes: [Normal, Deficient, Deficient with CNSHA, Variable, Indeterminate]
  provenance:
    source: cpic-g6pd-2022
    section: "gene_result: G6PD"
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: pgx.drug.codeine
  gene: CYP2D6
  atc: R05DA04
  recommendations:
    Ultrarapid Metabolizer: {action: avoid, strength: Strong, text: Avoid codeine because of
        the potential for serious toxicity; if an opioid is needed, consider a non-tramadol opioid.}
    Normal Metabolizer: {action: standard, strength: Strong, text: Use the label age- or
        weight-specific dose.}
    Intermediate Metabolizer: {action: standard_monitor, strength: Moderate, text: Use the label
        age- or weight-specific dose; if there is no response, consider a non-tramadol opioid.}
    Poor Metabolizer: {action: avoid, strength: Strong, text: Avoid codeine because of
        diminished analgesia; if an opioid is needed, consider a non-tramadol opioid.}
  provenance:
    source: cpic-cyp2d6-opioids-2021
    section: "recommendation: codeine"
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: pgx.drug.clopidogrel
  gene: CYP2C19
  atc: B01AC04
  default_indication: acs_pci
  recommendations_by_indication:
    acs_pci:
      Ultrarapid Metabolizer: {action: standard, strength: Strong, text: Use the standard dose
          (75 mg/day).}
      Rapid Metabolizer: {action: standard, strength: Strong, text: Use the standard dose
          (75 mg/day).}
      Normal Metabolizer: {action: standard, strength: Strong, text: Use the standard dose
          (75 mg/day).}
      Intermediate Metabolizer: {action: alternative, strength: Strong, text: Avoid the standard
          dose if possible; use prasugrel or ticagrelor at standard dose if not contraindicated.}
      Poor Metabolizer: {action: avoid, strength: Strong, text: Avoid clopidogrel if possible;
          use prasugrel or ticagrelor at standard dose if not contraindicated.}
    non_acs_non_pci:
      Normal Metabolizer: {action: standard, strength: Strong, text: Use the standard dose
          (75 mg/day).}
      Poor Metabolizer: {action: avoid, strength: Moderate, text: Avoid clopidogrel if possible;
          use prasugrel or ticagrelor at standard dose if not contraindicated.}
    neurovascular:
      Normal Metabolizer: {action: standard, strength: Strong, text: Use the standard dose
          (75 mg/day).}
      Intermediate Metabolizer: {action: alternative, strength: Moderate, text: Consider an
          alternative P2Y12 inhibitor at standard dose if indicated and not contraindicated.}
      Poor Metabolizer: {action: avoid, strength: Moderate, text: Avoid clopidogrel if possible;
          consider an alternative P2Y12 inhibitor at standard dose.}
  provenance:
    source: cpic-cyp2c19-2022
    section: "recommendation: clopidogrel"
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: pgx.drug.efavirenz
  gene: CYP2B6
  atc: J05AG03
  population: adults and children weighing more than 40 kg
  recommendations:
    Ultrarapid Metabolizer: {action: standard, strength: Strong, text: Start at the standard dose
        (600 mg/day).}
    Rapid Metabolizer: {action: standard, strength: Strong, text: Start at the standard dose
        (600 mg/day).}
    Normal Metabolizer: {action: standard, strength: Strong, text: Start at the standard dose
        (600 mg/day).}
    Intermediate Metabolizer: {action: reduce, strength: Moderate, text: Consider starting at
        400 mg/day.}
    Poor Metabolizer: {action: reduce, strength: Moderate, text: Consider starting at 400 or
        200 mg/day.}
  provenance:
    source: cpic-cyp2b6-2019
    section: "recommendation: efavirenz"
    extracted_by: llm
    verified_by: second_pass
    status: verified

- id: pgx.drug.primaquine
  gene: G6PD
  atc: P01BA03
  recommendations:
    Normal: {action: standard, strength: Strong, text: No reason to avoid based on G6PD status.}
    Deficient: {action: avoid, strength: Strong, text: Avoid primaquine, except where malaria
        treatment guidelines set out a G6PD-deficient regimen.}
    Deficient with CNSHA: {action: avoid, strength: Strong, text: Avoid primaquine.}
    Variable: {action: test, strength: Moderate, text: Measure G6PD enzyme activity and follow
        the activity-based phenotype.}
    Indeterminate: {action: test, strength: Moderate, text: Measure G6PD enzyme activity and
        follow the activity-based phenotype.}
  provenance:
    source: cpic-g6pd-2022
    section: "recommendation: primaquine"
    extracted_by: llm
    verified_by: second_pass
    status: verified

