# Conditions in scope (design 06, 6.2). Codes are verified by `sourcing verify-codes`.
# `twin` is the AHDT system twin that owns the diagnosis (write-back routing, PHKG OWNED_BY).
# `severity_rule` names the kb entry that grades the condition; `red_flags` are findings.yaml ids.

- id: cond.malaria_falciparum
  name: Plasmodium falciparum malaria
  snomed: '62676009'
  icd11: 1F40
