  twin: haematological
  severity_levels: [uncomplicated, severe]
  severity_rule: severity.malaria.falciparum
  red_flags: [find.impaired_consciousness, find.prostration, find.convulsions, find.respiratory_distress,
              find.hypoglycaemia, find.jaundice, find.bleeding, find.shock]
  provenance:
    source: who-malaria-2026
    section: 5.2.2 Treating severe malaria
    page: 212
    extracted_by: llm
    verified_by: second_pass
    status: verified

