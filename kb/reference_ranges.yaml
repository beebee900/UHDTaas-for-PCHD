# Reference, warning and critical ranges of every twin field.
# Status: crit if outside crit_low/crit_high, else warning outside warn_*, else abnormal outside ref_*.
# `by` lists strata (age in months, sex, pregnancy, patient group) with their own bounds.
# Fields without a sourced range carry `assumption: true` and stay without a status band.
- id: range.phq9
  field: phq9
  twin: behavioural_cognitive
  unit: '{score}'
  ref_low: null
  ref_high: 4
  warn_low: null
  warn_high: 9
  crit_low: null
  crit_high: 19
  note: Bands from severity.phq9.
  provenance:
    source: phq-manual
    page: 6
    derived:
      ref_high: Upper end of the minimal band (below the cutpoint 5).
      warn_high: Upper end of the mild band (below the cutpoint 10).
      crit_high: Upper end of the moderately severe band (below the cutpoint 20).
    extracted_by: llm
    verified_by: second_pass
    status: verified
